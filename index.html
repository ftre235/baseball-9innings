<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>타이밍 야구</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #14181d;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: "Trebuchet MS", "Malgun Gothic", sans-serif;
    touch-action: manipulation;
  }

  #game-container {
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.7);
    border-radius: 6px;
    overflow: hidden;
    line-height: 0;
  }

  canvas {
    display: block;
    background: #7ec0e8;
    cursor: pointer;
    max-width: 100vw;
    max-height: 100vh;
  }
</style>
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="720" height="520"></canvas>
  </div>
<script>
(function () {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;

  // ---------- 장면 좌표 (포수 시점) ----------
  const WALL_TOP = 150;
  const WALL_BOTTOM = 197;
  const MOUND_X = 360;
  const MOUND_Y = 318;
  const RELEASE = { x: 382, y: 262 };
  const PLATE = { x: 360, y: 452 };          // 홈플레이트 위 스트라이크존 중심
  const ZONE = { x: 336, y: 402, w: 48, h: 62 };
  const BATTER_X = 196;
  const BATTER_GROUND = 500;
  const FENCE_DISTANCE = 110;                // 담장까지 110m

  // ---------- 야구 상수 ----------
  const MOUND_DISTANCE = 18.44;              // m
  const TIME_SCALE = 1.35;                   // 실제보다 살짝 여유 (조작성)
  const CONTACT_WINDOW = 85;                 // ms, 이 안이면 배트에 맞음
  const FOUL_EDGE = 0.72;                    // 윈도우의 바깥쪽은 파울
  const TOTAL_PITCHES = 10;
  const STORAGE_KEY = "timing-baseball-best";

  let best = 0;
  try { best = parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10) || 0; } catch (e) { best = 0; }

  // ---------- 상태 ----------
  let phase = "ready";   // ready | wind | pitch | catch | contact | flight | result | over
  let score = 0, combo = 0, bestCombo = 0, homeRuns = 0, hits = 0, longest = 0;
  let pitchNumber = 0;

  let pitch = null, result = null, ball = null;
  let batSwing = 0, windT = 0, phaseTime = 0, shake = 0, flash = 0, lastTime = 0;

  const OUTCOMES = {
    homerun: { label: "홈런!",     color: "#ff5252", base: 300 },
    triple:  { label: "3루타",     color: "#ffb74d", base: 180 },
    double:  { label: "2루타",     color: "#64b5f6", base: 120 },
    single:  { label: "안타",      color: "#81c784", base: 70 },
    foul:    { label: "파울",      color: "#bdbdbd", base: 5 },
    flyout:  { label: "뜬공 아웃", color: "#90a4ae", base: 0 },
    lineout: { label: "직선타 아웃", color: "#90a4ae", base: 0 },
    groundout: { label: "땅볼 아웃", color: "#90a4ae", base: 0 },
    swing:   { label: "헛스윙!",   color: "#90a4ae", base: 0 },
    looking: { label: "루킹 삼진", color: "#90a4ae", base: 0 }
  };

  // ---------- 투구 ----------
  function newPitch() {
    pitchNumber++;
    const speed = 138 + Math.random() * 16;                       // km/h (직구)
    const flight = (MOUND_DISTANCE / (speed / 3.6)) * 1000 * TIME_SCALE;
    pitch = {
      speed: Math.round(speed),
      flight: flight,
      elapsed: 0,
      tx: PLATE.x + (Math.random() - 0.5) * 30,                   // 존 안쪽 코스
      ty: PLATE.y + (Math.random() - 0.5) * 44,
      swung: false
    };
    result = null; ball = null; batSwing = 0; windT = 0;
    phase = "wind"; phaseTime = 0;
  }

  function timingText(offset) {
    const a = Math.abs(offset);
    const dir = offset < 0 ? "빠름" : "늦음";
    if (a <= 12) return { text: "완벽한 타이밍!", perfect: true };
    if (a <= 30) return { text: "좋은 타이밍 · " + dir, perfect: false };
    if (a <= 55) return { text: "살짝 " + dir, perfect: false };
    return { text: "많이 " + dir, perfect: false };
  }

  // 타이밍 → 타구 속도 / 발사각 / 비거리 (실제 타구 물리에 맞춰 근사)
  function judge(offset) {
    const a = Math.abs(offset);
    const timing = timingText(offset);
    const r = { offset: offset, timing: timing, exit: 0, angle: 0, distance: 0 };

    if (a > CONTACT_WINDOW) { r.kind = "swing"; return r; }

    const acc = 1 - a / CONTACT_WINDOW;                           // 0~1 정확도
    const exitKmh = 95 + Math.pow(acc, 1.25) * 90 + (Math.random() * 8 - 4);
    const v = exitKmh / 3.6;                                      // m/s
    // 정타일수록 이상적인 발사각(약 27도)에 가까움
    const spread = 26 * (1 - acc) + 4;
    const angle = 27 + (Math.random() * 2 - 1) * spread - (1 - acc) * 6;
    const rad = angle * Math.PI / 180;
    const distance = Math.max(2, (v * v * Math.sin(2 * Math.max(0.05, rad)) / 9.8) * 0.62);

    r.exit = Math.round(exitKmh);
    r.angle = Math.round(angle);
    r.distance = Math.round(distance);
    r.pull = offset < 0 ? -1 : 1;                                 // 빠르면 당겨치고, 늦으면 밀어침

    if (a > CONTACT_WINDOW * FOUL_EDGE) { r.kind = "foul"; r.distance = Math.round(distance * 0.4); return r; }

    if (r.angle >= 50) r.kind = "flyout";
    else if (r.distance >= FENCE_DISTANCE && r.angle >= 18) r.kind = "homerun";
    else if (r.angle < 8) r.kind = r.distance >= 45 ? "single" : "groundout";
    else if (r.distance >= 85) r.kind = "triple";
    else if (r.distance >= 60) r.kind = "double";
    else if (r.distance >= 32) r.kind = r.angle > 40 ? "flyout" : "single";
    else r.kind = r.angle > 30 ? "flyout" : "lineout";

    return r;
  }

  function applyResult(r) {
    const info = OUTCOMES[r.kind];
    const isHit = r.kind === "homerun" || r.kind === "triple" || r.kind === "double" || r.kind === "single";
    const multiplier = Math.min(1 + combo * 0.25, 3);

    let gained = info.base;
    if (r.kind === "homerun") gained += r.distance;
    gained = Math.round(gained * multiplier);

    r.multiplier = multiplier;
    r.gained = gained;
    r.comboBefore = combo;
    score += gained;

    if (isHit) {
      combo++; hits++;
      if (combo > bestCombo) bestCombo = combo;
      if (r.kind === "homerun") homeRuns++;
      if (r.distance > longest) longest = r.distance;
    } else if (r.kind === "foul") {
      // 콤보 유지
    } else {
      combo = 0;
    }

    if (score > best) {
      best = score;
      try { localStorage.setItem(STORAGE_KEY, String(best)); } catch (e) {}
    }
  }

  function swing() {
    if (phase !== "pitch" || pitch.swung) return;
    pitch.swung = true;
    batSwing = 0.0001;

    const r = judge(Math.round(pitch.elapsed - pitch.flight));
    result = r;
    applyResult(r);

    if (r.kind === "swing") {
      phase = "catch"; phaseTime = 0;
    } else {
      flash = 1;
      shake = r.kind === "homerun" ? 12 : 6;
      ball = { t: 0, flightTime: 600 + r.distance * 8 };
      phase = "flight"; phaseTime = 0;
    }
  }

  function reset() {
    score = 0; combo = 0; bestCombo = 0; homeRuns = 0; hits = 0; longest = 0; pitchNumber = 0;
    newPitch();
  }

  function handleInput() {
    if (phase === "ready") reset();
    else if (phase === "pitch") swing();
    else if (phase === "over") phase = "ready";
  }

  function update(dt) {
    phaseTime += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 0.04);
    if (flash > 0) flash = Math.max(0, flash - dt * 0.006);
    if (batSwing > 0 && batSwing < 1) batSwing = Math.min(1, batSwing + dt / 190);

    if (phase === "wind") {
      windT = Math.min(1, phaseTime / 850);
      if (phaseTime >= 850) { phase = "pitch"; phaseTime = 0; }
    } else if (phase === "pitch") {
      pitch.elapsed += dt;
      if (pitch.elapsed > pitch.flight + CONTACT_WINDOW + 30) {
        if (!pitch.swung) {
          result = { kind: "looking", offset: 0, timing: { text: "그냥 지켜봤습니다", perfect: false }, exit: 0, angle: 0, distance: 0 };
          applyResult(result);
        }
        phase = "catch"; phaseTime = 0;
      }
    } else if (phase === "catch") {
      if (phaseTime >= 420) { phase = "result"; phaseTime = 0; }
    } else if (phase === "flight") {
      ball.t = Math.min(1, ball.t + dt / ball.flightTime);
      if (ball.t >= 1) { phase = "result"; phaseTime = 0; }
    } else if (phase === "result") {
      if (phaseTime >= 1700) {
        if (pitchNumber >= TOTAL_PITCHES) { phase = "over"; phaseTime = 0; }
        else newPitch();
      }
    }
  }

  // ---------- 그리기 도우미 ----------
  function roundRect(x, y, w, h, r, fill) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  }

  function drawBall(x, y, r, spin) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(spin || 0);
    ctx.beginPath();
    ctx.fillStyle = "#fdfdfd";
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    if (r > 4) {
      ctx.strokeStyle = "#d9534f";
      ctx.lineWidth = Math.max(1, r * 0.16);
      ctx.beginPath();
      ctx.arc(-r * 0.75, 0, r * 1.1, -0.9, 0.9);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(r * 0.75, 0, r * 1.1, Math.PI - 0.9, Math.PI + 0.9);
      ctx.stroke();
    }
    ctx.strokeStyle = "rgba(0,0,0,0.25)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // ---------- 구장 ----------
  function drawField() {
    // 하늘
    const sky = ctx.createLinearGradient(0, 0, 0, WALL_TOP);
    sky.addColorStop(0, "#5aa7dd");
    sky.addColorStop(1, "#bfe0f2");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, WALL_TOP);

    // 관중석
    ctx.fillStyle = "#3d4a57";
    ctx.fillRect(0, 96, W, WALL_TOP - 96);
    for (let i = 0; i < 260; i++) {
      const cx = (i * 47) % W + ((i % 3) * 7);
      const cy = 100 + ((i * 13) % (WALL_TOP - 104));
      ctx.fillStyle = ["#6b7a88", "#8b98a4", "#59646f", "#a4b0ba"][i % 4];
      ctx.fillRect(cx, cy, 4, 4);
    }

    // 외야 담장
    ctx.fillStyle = "#1f4d35";
    ctx.fillRect(0, WALL_TOP, W, WALL_BOTTOM - WALL_TOP);
    ctx.fillStyle = "#f2c94c";
    ctx.fillRect(0, WALL_TOP, W, 4);
    ctx.font = "bold 15px 'Trebuchet MS', sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.textAlign = "center";
    ctx.fillText(FENCE_DISTANCE + "m", MOUND_X, WALL_TOP + 32);
    ctx.fillText("95m", 90, WALL_TOP + 32);
    ctx.fillText("95m", W - 90, WALL_TOP + 32);

    // 잔디
    const grass = ctx.createLinearGradient(0, WALL_BOTTOM, 0, H);
    grass.addColorStop(0, "#3f8c4e");
    grass.addColorStop(1, "#5aa862");
    ctx.fillStyle = grass;
    ctx.fillRect(0, WALL_BOTTOM, W, H - WALL_BOTTOM);

    // 잔디 줄무늬 (원근감)
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, WALL_BOTTOM, W, H - WALL_BOTTOM);
    ctx.clip();
    for (let i = -6; i <= 6; i++) {
      ctx.beginPath();
      ctx.fillStyle = i % 2 === 0 ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.04)";
      ctx.moveTo(MOUND_X + i * 46, WALL_BOTTOM);
      ctx.lineTo(MOUND_X + (i + 1) * 46, WALL_BOTTOM);
      ctx.lineTo(MOUND_X + (i + 1) * 190, H);
      ctx.lineTo(MOUND_X + i * 190, H);
      ctx.closePath();
      ctx.fill();
    }

    // 내야 흙
    ctx.beginPath();
    ctx.fillStyle = "#b07b4f";
    ctx.moveTo(-60, H);
    ctx.quadraticCurveTo(MOUND_X, 258, W + 60, H);
    ctx.closePath();
    ctx.fill();

    // 파울 라인
    ctx.strokeStyle = "rgba(255,255,255,0.8)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(PLATE.x - 6, H - 8);
    ctx.lineTo(-40, WALL_BOTTOM + 30);
    ctx.moveTo(PLATE.x + 6, H - 8);
    ctx.lineTo(W + 40, WALL_BOTTOM + 30);
    ctx.stroke();

    // 베이스
    const bases = [[MOUND_X, 288, 9], [MOUND_X + 132, 330, 12], [MOUND_X - 132, 330, 12]];
    bases.forEach(function (b) {
      ctx.fillStyle = "#f5f5f5";
      ctx.beginPath();
      ctx.moveTo(b[0], b[1] - b[2] * 0.4);
      ctx.lineTo(b[0] + b[2], b[1]);
      ctx.lineTo(b[0], b[1] + b[2] * 0.4);
      ctx.lineTo(b[0] - b[2], b[1]);
      ctx.closePath();
      ctx.fill();
    });
    ctx.restore();

    // 마운드
    ctx.beginPath();
    ctx.fillStyle = "#c08a5c";
    ctx.ellipse(MOUND_X, MOUND_Y + 6, 62, 15, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#f0f0f0";
    ctx.fillRect(MOUND_X - 14, MOUND_Y + 3, 28, 4);

    // 홈플레이트 + 타석 라인
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = 3;
    ctx.strokeRect(BATTER_X - 60, 468, 120, 46);
    ctx.strokeRect(W - BATTER_X - 60, 468, 120, 46);
    ctx.beginPath();
    ctx.fillStyle = "#f7f7f7";
    ctx.moveTo(PLATE.x - 30, 490);
    ctx.lineTo(PLATE.x + 30, 490);
    ctx.lineTo(PLATE.x + 20, 506);
    ctx.lineTo(PLATE.x - 20, 506);
    ctx.closePath();
    ctx.fill();
  }

  function drawStrikeZone() {
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.45)";
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.strokeRect(ZONE.x, ZONE.y, ZONE.w, ZONE.h);
    ctx.setLineDash([]);
    ctx.restore();
  }

  // ---------- 투수 (정면, 멀리) ----------
  function drawPitcher() {
    const t = phase === "wind" ? windT : (phase === "pitch" ? 1 : 0);
    const x = MOUND_X;
    const feet = MOUND_Y + 2;
    const lift = Math.sin(Math.min(t, 0.55) / 0.55 * Math.PI) * (t < 0.6 ? 1 : 0);
    const stride = t > 0.55 ? Math.min(1, (t - 0.55) / 0.45) : 0;

    ctx.save();
    ctx.translate(x, feet);

    // 그림자
    ctx.beginPath();
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.ellipse(0, 2, 20, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    const hip = -34, shoulder = -62, headY = -76;

    // 다리
    ctx.strokeStyle = "#d8dde2";
    ctx.lineWidth = 7;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(0, hip);
    ctx.lineTo(-4 - stride * 12, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, hip);
    if (lift > 0.1) ctx.lineTo(8 + lift * 6, hip - lift * 14);
    else ctx.lineTo(6 + stride * 14, 0);
    ctx.stroke();

    // 몸통 (원정 회색 유니폼)
    roundRect(-11, shoulder, 22, shoulder * -1 + hip, 6, "#eceff1");
    ctx.fillStyle = "#1b3a6b";
    ctx.fillRect(-11, shoulder + 2, 22, 3);

    // 팔 (와인드업 → 릴리스)
    const armAngle = -2.6 + t * 2.1;
    ctx.strokeStyle = "#eceff1";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(0, shoulder + 6);
    ctx.lineTo(Math.cos(armAngle) * 22, shoulder + 6 + Math.sin(armAngle) * 22);
    ctx.stroke();
    // 글러브 손
    ctx.beginPath();
    ctx.fillStyle = "#7b4b2a";
    ctx.arc(-14 + stride * 4, shoulder + 12, 6, 0, Math.PI * 2);
    ctx.fill();

    // 머리 + 모자
    ctx.beginPath();
    ctx.fillStyle = "#e8b88f";
    ctx.arc(0, headY, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = "#1b3a6b";
    ctx.arc(0, headY - 2, 9, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(-9, headY - 3, 18, 3);
    ctx.fillRect(-10, headY - 3, 6, 2);

    ctx.restore();
  }

  // ---------- 타자 (뒷모습, 좌측) ----------
  function drawBatter() {
    const swingEase = batSwing === 0 ? 0 : 1 - Math.pow(1 - batSwing, 3);
    const stride = Math.sin(swingEase * Math.PI) * 6;
    const x = BATTER_X + stride;
    const g = BATTER_GROUND;

    ctx.save();

    // 그림자
    ctx.beginPath();
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.ellipse(x, g + 6, 42, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    const hipY = g - 96, shoulderY = g - 168, headY = g - 196;

    // 다리 (회색 바지)
    ctx.fillStyle = "#cfd4d9";
    roundRect(x - 30, hipY, 26, 74, 9, "#cfd4d9");
    roundRect(x + 6, hipY, 26, 74, 9, "#cfd4d9");
    // 스타킹 + 스파이크
    ctx.fillStyle = "#b03030";
    ctx.fillRect(x - 29, hipY + 68, 24, 14);
    ctx.fillRect(x + 7, hipY + 68, 24, 14);
    ctx.fillStyle = "#22272b";
    roundRect(x - 34, g - 12, 32, 14, 4, "#22272b");
    roundRect(x + 4, g - 12, 32, 14, 4, "#22272b");

    // 상체 (홈 흰색 유니폼 + 세로 줄무늬)
    ctx.save();
    roundRect(x - 34, shoulderY, 68, hipY - shoulderY + 12, 14, "#f6f7f8");
    ctx.clip();
    ctx.fillStyle = "rgba(27,58,107,0.22)";
    for (let i = -3; i <= 3; i++) ctx.fillRect(x + i * 11 - 1, shoulderY, 2, 100);
    ctx.restore();

    // 등번호
    ctx.fillStyle = "#1b3a6b";
    ctx.font = "bold 26px 'Trebuchet MS', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("7", x, shoulderY + 52);

    // 벨트
    ctx.fillStyle = "#22272b";
    ctx.fillRect(x - 32, hipY - 4, 64, 8);

    // 헬멧 (뒷모습)
    ctx.beginPath();
    ctx.fillStyle = "#e8b88f";
    ctx.arc(x, headY + 16, 13, 0, Math.PI * 2);   // 목/뒷머리
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = "#1b3a6b";
    ctx.arc(x, headY, 21, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = "#16305a";
    ctx.ellipse(x + 17, headY + 2, 9, 7, 0.3, 0, Math.PI * 2);  // 귀덮개
    ctx.fill();

    // 팔 + 배트
    const pivotX = x + 26, pivotY = shoulderY + 24;
    const angle = -2.05 + swingEase * 2.6;
    const batLen = 118;
    const tipX = pivotX + Math.cos(angle) * batLen;
    const tipY = pivotY + Math.sin(angle) * batLen;

    // 스윙 잔상
    if (batSwing > 0 && batSwing < 1) {
      ctx.strokeStyle = "rgba(255,255,255,0.22)";
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.arc(pivotX, pivotY, batLen * 0.82, angle - 1.1, angle);
      ctx.stroke();
    }

    // 팔
    ctx.strokeStyle = "#f6f7f8";
    ctx.lineWidth = 15;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x + 10, shoulderY + 14);
    ctx.lineTo(pivotX, pivotY);
    ctx.stroke();

    // 배트
    ctx.save();
    ctx.translate(pivotX, pivotY);
    ctx.rotate(angle);
    const grad = ctx.createLinearGradient(0, 0, batLen, 0);
    grad.addColorStop(0, "#7a4a22");
    grad.addColorStop(1, "#c98b4b");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, -4);
    ctx.lineTo(batLen * 0.55, -6);
    ctx.lineTo(batLen, -9);
    ctx.lineTo(batLen, 9);
    ctx.lineTo(batLen * 0.55, 6);
    ctx.lineTo(0, 4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#22272b";
    ctx.fillRect(-4, -5, 10, 10);
    ctx.restore();

    // 장갑
    ctx.beginPath();
    ctx.fillStyle = "#b03030";
    ctx.arc(pivotX, pivotY, 9, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
    return { tipX: tipX, tipY: tipY };
  }

  // ---------- 포수 미트 ----------
  function drawMitt() {
    const catching = phase === "catch";
    const x = PLATE.x + 78, y = H - 6 - (catching ? 34 : 16);
    ctx.save();
    ctx.beginPath();
    ctx.fillStyle = "#6b3f21";
    ctx.arc(x, y, 34, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = "#8a5730";
    ctx.arc(x, y - 3, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#4a2a14";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, 34, Math.PI * 1.05, Math.PI * 1.95);
    ctx.stroke();
    ctx.restore();
  }

  // ---------- 공 ----------
  function pitchPoint(t) {
    const z = Math.max(0, (1 - t)) * MOUND_DISTANCE;
    const s = 1 / (1 + z * 0.5);
    const s0 = 1 / (1 + MOUND_DISTANCE * 0.5);
    const k = (s - s0) / (1 - s0);
    return {
      x: RELEASE.x + (pitch.tx - RELEASE.x) * k,
      y: RELEASE.y + (pitch.ty - RELEASE.y) * k + Math.pow(t, 2) * 6,
      r: 2.5 + 13 * k,
      k: k
    };
  }

  function drawPitchedBall() {
    const t = Math.min(1.25, pitch.elapsed / pitch.flight);
    const p = pitchPoint(t);

    // 잔상
    for (let i = 3; i >= 1; i--) {
      const bp = pitchPoint(Math.max(0, t - i * 0.055));
      ctx.beginPath();
      ctx.fillStyle = "rgba(255,255,255," + (0.22 - i * 0.05) + ")";
      ctx.arc(bp.x, bp.y, bp.r * 0.9, 0, Math.PI * 2);
      ctx.fill();
    }

    // 그림자
    ctx.beginPath();
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.ellipse(p.x + 6, MOUND_Y + 20 + p.k * 190, p.r * 1.1, p.r * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    drawBall(p.x, p.y, p.r, pitch.elapsed * 0.02);
  }

  function hitScreenY(d) {
    const g = (1 - 1 / (1 + d * 0.035)) / (1 - 1 / (1 + FENCE_DISTANCE * 0.035));
    return PLATE.y + 26 - (PLATE.y + 26 - (WALL_BOTTOM - 4)) * Math.min(1.25, g);
  }

  function drawHitBall() {
    const t = ball.t;
    const d = result.distance * t;
    const arc = Math.min(300, 60 + result.distance * 1.5 + Math.max(0, result.angle - 12) * 3.2);

    const startX = pitch.tx, startY = pitch.ty;
    const endX = PLATE.x + result.pull * Math.min(240, result.distance * 2.1);
    const endY = hitScreenY(result.distance) - (result.kind === "homerun" ? 70 : 0);

    const x = startX + (endX - startX) * t;
    const y = startY + (endY - startY) * t - Math.sin(t * Math.PI) * arc;
    const r = Math.max(2, 14 - 12 * t);

    // 궤적
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 24; i++) {
      const tt = t * (i / 24);
      const px = startX + (endX - startX) * tt;
      const py = startY + (endY - startY) * tt - Math.sin(tt * Math.PI) * arc;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    drawBall(x, y, r, t * 12);

    ctx.font = "bold 17px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.fillText(Math.round(d) + "m", x, y - r - 10);
  }

  // ---------- UI ----------
  function drawHUD() {
    ctx.save();
    ctx.fillStyle = "rgba(10,14,18,0.55)";
    ctx.fillRect(0, 0, W, 66);

    ctx.textAlign = "left";
    ctx.font = "bold 24px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#fff";
    ctx.fillText(String(score), 20, 32);
    ctx.font = "12px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#9fb0bd";
    ctx.fillText("점수", 20, 50);

    ctx.font = "13px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#cfd8dd";
    ctx.fillText("홈런 " + homeRuns + "   안타 " + hits + "   최고비거리 " + longest + "m", 92, 46);

    if (combo > 0) {
      const mult = Math.min(1 + combo * 0.25, 3);
      ctx.font = "bold 18px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
      ctx.fillStyle = "#ffb74d";
      ctx.fillText(combo + "연속  x" + mult.toFixed(2).replace(/0$/, ""), 92, 26);
    }

    ctx.textAlign = "right";
    ctx.font = "bold 15px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#64b5f6";
    ctx.fillText("최고 점수 " + best, W - 20, 26);

    const shown = phase === "ready" ? 0 : pitchNumber;
    ctx.font = "13px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#9fb0bd";
    ctx.fillText("공 " + shown + " / " + TOTAL_PITCHES, W - 20, 46);
    for (let i = 0; i < TOTAL_PITCHES; i++) {
      ctx.beginPath();
      ctx.fillStyle = i < shown ? "#546a78" : "#e8eef2";
      ctx.arc(W - 20 - i * 13, 56, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    if (phase === "wind" || phase === "pitch") {
      ctx.textAlign = "center";
      ctx.font = "bold 14px 'Trebuchet MS', sans-serif";
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.fillText("직구 " + pitch.speed + " km/h", MOUND_X, 96);
    }
    ctx.restore();
  }

  function drawTimingBar(offset) {
    const bx = W / 2 - 130, by = 236, bw = 260, bh = 10;
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    roundRect(bx, by, bw, bh, 5, "rgba(255,255,255,0.18)");
    ctx.fillStyle = "rgba(129,199,132,0.55)";
    roundRect(W / 2 - 30, by, 60, bh, 5, "rgba(129,199,132,0.55)");
    ctx.fillStyle = "#fff";
    ctx.fillRect(W / 2 - 1, by - 4, 2, bh + 8);

    const clamped = Math.max(-CONTACT_WINDOW * 1.6, Math.min(CONTACT_WINDOW * 1.6, offset));
    const px = W / 2 + (clamped / (CONTACT_WINDOW * 1.6)) * (bw / 2);
    ctx.beginPath();
    ctx.fillStyle = "#ffb74d";
    ctx.arc(px, by + bh / 2, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = "11px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#9fb0bd";
    ctx.textAlign = "left";
    ctx.fillText("빠름", bx, by + 26);
    ctx.textAlign = "right";
    ctx.fillText("늦음", bx + bw, by + 26);
  }

  function drawResult() {
    if (!result) return;
    const info = OUTCOMES[result.kind];
    const a = Math.min(1, phaseTime / 160);

    ctx.save();
    ctx.globalAlpha = a;
    roundRect(W / 2 - 200, 96, 400, 190, 14, "rgba(10,14,18,0.78)");

    ctx.textAlign = "center";
    ctx.font = "bold 42px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = info.color;
    ctx.fillText(info.label, W / 2, 148);

    ctx.font = "bold 18px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = result.timing.perfect ? "#ff5252" : "#e8eef2";
    ctx.fillText(result.timing.text, W / 2, 178);

    ctx.font = "13px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#9fb0bd";
    if (result.exit > 0) {
      ctx.fillText("타구속도 " + result.exit + "km/h   발사각 " + result.angle + "°   비거리 " + result.distance + "m", W / 2, 202);
    } else if (result.kind === "looking") {
      ctx.fillText("직구 " + pitch.speed + "km/h · 스윙하지 않았습니다", W / 2, 202);
    } else {
      ctx.fillText("타이밍 오차 " + Math.abs(result.offset) + "ms", W / 2, 202);
    }

    if (result.gained > 0) {
      ctx.font = "bold 20px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
      ctx.fillStyle = "#81c784";
      const m = result.multiplier > 1 ? "  x" + result.multiplier.toFixed(2).replace(/0$/, "") : "";
      ctx.fillText("+" + result.gained + m, W / 2, 226);
    } else if (result.comboBefore > 0) {
      ctx.font = "bold 15px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
      ctx.fillStyle = "#90a4ae";
      ctx.fillText("콤보 초기화", W / 2, 226);
    }

    if (result.kind !== "looking") drawTimingBar(result.offset);
    ctx.restore();
  }

  function drawReady() {
    ctx.save();
    ctx.fillStyle = "rgba(10,14,18,0.6)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";

    ctx.font = "bold 46px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#fff";
    ctx.fillText("타이밍 야구", W / 2, 180);

    ctx.font = "16px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#cfd8dd";
    ctx.fillText("포수 시점 · 직구 " + TOTAL_PITCHES + "구", W / 2, 218);
    ctx.fillText("공이 홈플레이트에 닿는 순간 클릭 / 스페이스로 스윙", W / 2, 246);
    ctx.fillText("타이밍이 정확할수록 타구속도와 비거리가 올라갑니다", W / 2, 272);
    ctx.fillText("연속 안타로 콤보 배수를 최대 x3까지", W / 2, 298);

    ctx.font = "bold 20px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#64b5f6";
    ctx.fillText("클릭해서 시작", W / 2, 350);

    ctx.font = "14px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#9fb0bd";
    ctx.fillText("최고 점수 " + best, W / 2, 384);
    ctx.restore();
  }

  function drawGameOver() {
    ctx.save();
    ctx.fillStyle = "rgba(10,14,18,0.82)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";

    ctx.font = "bold 34px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#fff";
    ctx.fillText("경기 종료", W / 2, 150);

    ctx.font = "bold 62px 'Trebuchet MS', sans-serif";
    ctx.fillStyle = "#64b5f6";
    ctx.fillText(String(score), W / 2, 222);

    ctx.font = "15px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#cfd8dd";
    ctx.fillText("안타 " + hits + " / " + TOTAL_PITCHES + "    홈런 " + homeRuns +
                 "    최고 비거리 " + longest + "m    최고 콤보 " + bestCombo, W / 2, 262);

    ctx.font = "bold 20px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    if (score >= best && score > 0) {
      ctx.fillStyle = "#ff5252";
      ctx.fillText("신기록 달성!", W / 2, 302);
    } else {
      ctx.fillStyle = "#90a4ae";
      ctx.fillText("최고 점수 " + best, W / 2, 302);
    }

    ctx.font = "bold 18px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#64b5f6";
    ctx.fillText("클릭해서 다시 하기", W / 2, 352);
    ctx.restore();
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    drawField();
    drawStrikeZone();
    drawPitcher();

    if (phase === "pitch") drawPitchedBall();
    if (phase === "catch") {
      // 스쳐간 공이 포수 미트로 빨려 들어감
      const ct = Math.min(1, phaseTime / 180);
      const mx = PLATE.x + 78, my = H - 46;
      drawBall(pitch.tx + (mx - pitch.tx) * ct, pitch.ty + (my - pitch.ty) * ct, 15 - ct * 3, phaseTime * 0.02);
    }
    if (phase === "flight") drawHitBall();

    drawMitt();
    drawBatter();

    if (flash > 0) {
      ctx.save();
      ctx.globalAlpha = flash * 0.8;
      const g = ctx.createRadialGradient(pitch.tx, pitch.ty, 2, pitch.tx, pitch.ty, 70);
      g.addColorStop(0, "#fff");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(pitch.tx, pitch.ty, 70, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    drawHUD();
    if (phase === "result") drawResult();
    if (phase === "ready") drawReady();
    if (phase === "over") drawGameOver();

    ctx.restore();
  }

  function loop(now) {
    if (!lastTime) lastTime = now;
    const dt = Math.min(50, now - lastTime);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  canvas.addEventListener("mousedown", function (e) { e.preventDefault(); handleInput(); });
  canvas.addEventListener("touchstart", function (e) { e.preventDefault(); handleInput(); }, { passive: false });
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); handleInput(); }
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
