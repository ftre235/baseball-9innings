  function jerseyIsLight(color) {
    const r = parseInt(color.slice(1, 3), 16), g = parseInt(color.slice(3, 5), 16), b = parseInt(color.slice(5, 7), 16);
    return (r * 0.299 + g * 0.587 + b * 0.114) > 150;
  }

  function buildTeam(data) {
    const light = jerseyIsLight(data.color);
    return {
      id: data.short, name: data.name, short: data.short, color: data.color, dark: data.dark,
      pants: light ? "#d3d8dd" : "#7c7f86",
      numberColor: light ? data.dark : "#f5eceb",
      lineup: data.batters.map(function (b) { return batter(b[0], b[1], b[2], b[3], b[4]); }),
      staff: data.pitchers.map(function (q) { return pitcher(q[0], q[1], q[2], q[3], q[4], q[5]); }),
      pitcherIdx: 0, order: 0
    };
  }

      control: ctl / data.pitchers.length,
      stamina: sta / data.pitchers.length / 100
    };
  }
  // 리그 평균 대비로 팀 색깔을 정한다
  let LEAGUE_AVG = null;
  function leagueAvg() {
    if (LEAGUE_AVG) return LEAGUE_AVG;
    const acc = { contact: 0, power: 0, speed: 0, control: 0, stamina: 0 };
    TEAM_DATA.forEach(function (d) {
      const sm = teamSummary(d);
      for (const k in acc) acc[k] += sm[k];
    });
    for (const k in acc) acc[k] /= TEAM_DATA.length;
    LEAGUE_AVG = acc;
    return acc;
  }
  function teamTag(sm) {
    const a = leagueAvg();
    const cand = [
      ["장타 군단", (sm.power - a.power) / 0.05],
      ["기동력", (sm.speed - a.speed) / 0.05],
      ["마운드 강세", ((sm.control - a.control) / 0.03 + (sm.stamina - a.stamina) / 0.06) / 2],
      ["정교한 타선", (sm.contact - a.contact) / 0.03]
    ];
    cand.sort(function (x, y) { return y[1] - x[1]; });
    return cand[0][1] > 0.6 ? cand[0][0] : "균형";
  }
  let lastTime = 0, shake = 0, flash = 0;
  let lastError = null, errorCount = 0, failStreak = 0;

  function noteError(where, e) {
    errorCount++;
    const stack = String((e && e.stack) || "");
    lastError = {
      where: where,
      msg: String((e && e.message) || e),
      at: (game ? game.inning + (game.half === "top" ? "회초" : "회말") : "-") + " / " + (anim ? anim.phase : "-"),
      stack: stack.slice(0, 240)
    };
    if (window.console && console.error) console.error("[9이닝 야구]", where, e);
  }

  // 어떤 이유로 진행이 막혀도 경기를 이어가기 위한 복구
  function recoverFromError() {
    try {
      shake = 0; flash = 0;
      cam.tx = cam.x = W / 2; cam.ty = cam.y = H / 2; cam.tscale = cam.scale = 1;
      anim.ballFlight = null; anim.batted = null; anim.runnerAnim = null;
      anim.stealResult = null; anim.pitch = null; anim.batSwing = 0;
      game.steals = [];
      game.balls = 0; game.strikes = 0;
      if (game.outs >= 3) endHalf();
      if (game.over) { setPhase("game-end", 0); return; }
      nextBatter();
    } catch (e2) {
      noteError("recover", e2);
      anim.phase = "title";
    }
  }
  let cam = { x: W / 2, y: H / 2, scale: 1, tx: W / 2, ty: H / 2, tscale: 1 };

  function newGame() {
    [HOME_TEAM, AWAY_TEAM].forEach(function (t) {
      t.pitcherIdx = 0; t.order = 0;
      t.staff.forEach(function (p) { p.stamina = p.max; p.pitches = 0; p.runs = 0; p.k = 0; });
      t.lineup.forEach(function (b) { b.ab = 0; b.hit = 0; b.rbi = 0; });
    });
    game = {
      inning: 1, half: "top", outs: 0, balls: 0, strikes: 0,
      bases: [null, null, null], steals: [], pitchLog: [],
      lines: { away: [], home: [] },
      runs: { away: 0, home: 0 },
      hits: { away: 0, home: 0 },
      errors: { away: 0, home: 0 },
      over: false, walkoff: false, log: []
    };
    startHalf();
  }

  function battingTeam() { return game.half === "top" ? AWAY_TEAM : HOME_TEAM; }
  function fieldingTeam() { return game.half === "top" ? HOME_TEAM : AWAY_TEAM; }
  // 봇: 유저는 항상 홈팀. 온라인: 호스트가 홈팀, 참가자가 원정팀
  function userIsPitching() { return game.half === (iAmHome() ? "top" : "bottom"); }
  function isOnline() { return ui.mode === "online" && net && net.peerJoined; }
  function currentPitcher() { const t = fieldingTeam(); return t.staff[t.pitcherIdx]; }
  function currentBatter() { const t = battingTeam(); return t.lineup[t.order]; }
  function runnersOn() { return game.bases.filter(function (b) { return b; }).length; }

  // 도루: 다음 베이스가 빈 1루/2루 주자를 각자 따로 보낼 수 있다
  function stealSuccessRate(runner, from) {
    // 3루 도루는 송구 거리가 짧아 더 어렵다
    const base = 0.2 + runner.p.speed * 0.62 - (from === 1 ? 0.08 : 0);
    return clamp(base, 0.15, 0.88);
  }
  function stealCandidates() {
    const list = [];
    // 앞 주자가 뛰면 뒤 주자도 따라 뛸 수 있다 (더블 스틸)
    for (let i = 1; i >= 0; i--) {
      const r = game.bases[i];
      if (!r) continue;
      const nextFree = !game.bases[i + 1] || (i + 1 <= 1 && isStealing(i + 1));
      if (nextFree) list.push({ from: i, runner: r, rate: stealSuccessRate(r, i) });
    }
    return list.reverse();
  }
  function isStealing(from) {
    return game.steals.some(function (st) { return st.from === from; });
  }
  function toggleSteal(from) {
    if (userIsPitching()) return false;
    if (["set", "wind", "pitch"].indexOf(anim.phase) < 0) return false;
    const idx = game.steals.findIndex(function (st) { return st.from === from; });
    if (idx >= 0) { game.steals.splice(idx, 1); return true; }
    const r = game.bases[from];
    if (!r) return false;
    // 다음 베이스가 비었거나, 앞 주자도 함께 뛰는 경우(더블 스틸)만 가능
    if (game.bases[from + 1] && !(from + 1 <= 1 && isStealing(from + 1))) return false;
    game.steals.push({ from: from, runner: r });
    if (isOnline()) netSend({ t: "steal", from: from });
    ui.message = r.p.name + " 도루 시도!";
    return true;
  }
  function trySteal() {
    const c = stealCandidates();
    if (!c.length) return false;
    return toggleSteal(c[c.length - 1].from);     // S 키: 선행 주자부터
  }
  function cpuStealDecision() {
    if (isOnline()) return;                 // 온라인은 상대가 직접 결정한다
    if (!userIsPitching() || game.steals.length) return;
    stealCandidates().forEach(function (c) {
      const chance = Math.max(0, c.runner.p.speed - 0.62) * 0.45;
      if (Math.random() < chance) game.steals.push({ from: c.from, runner: c.runner });
    });
  }
  function resolveSteals() {
    if (!game.steals.length) return null;
    // 선행 주자부터 처리해야 뒤 주자가 들어갈 자리가 생긴다
    const list = game.steals.slice().sort(function (a, b) { return b.from - a.from; });
    game.steals = [];
    const results = [];
    list.forEach(function (st) {
      const r = st.runner;
      if (game.bases[st.from] !== r || game.bases[st.from + 1]) return;   // 상황이 바뀌면 무효
      const ok = Math.random() < stealSuccessRate(r, st.from);
      game.bases[st.from] = null;
      if (ok) {
        game.bases[st.from + 1] = r;
        r.p.sb++;
        results.push({ ok: true, runner: r, from: st.from + 1, to: st.from + 2,
          text: r.p.name + " " + (st.from === 0 ? "2루" : "3루") + " 도루 성공!" });
      } else {
        game.outs++;
        r.p.cs++;
        results.push({ ok: false, runner: r, from: st.from + 1, to: st.from + 1,
          text: r.p.name + " 도루 실패 · 아웃" });
      }
    });
    if (!results.length) return null;
    return {
      list: results,
      ok: results.every(function (x) { return x.ok; }),
      text: results.map(function (x) { return x.text; }).join("   ")
    };
  }

  function startHalf() {
    game.outs = 0; game.balls = 0; game.strikes = 0;
    game.bases = [null, null, null]; game.steals = [];
    const key = game.half === "top" ? "away" : "home";
    while (game.lines[key].length < game.inning - 1) game.lines[key].push(0);
    game.lines[key][game.inning - 1] = 0;
    setPhase("half-start", 1500);
  }

  function addRuns(n) {
    if (n <= 0) return;
    const key = game.half === "top" ? "away" : "home";
    game.runs[key] += n;
    game.lines[key][game.inning - 1] = (game.lines[key][game.inning - 1] || 0) + n;
    currentPitcher().runs += n;
  }

  // 끝내기 / 경기 종료 판정
  function checkGameEnd() {
    if (game.half === "bottom" && game.inning >= TOTAL_INNINGS && game.runs.home > game.runs.away) {
      game.walkoff = true; game.over = true; return true;
    }
    return false;
  }

  function endHalf() {
    if (game.half === "top") {
      // 9회 이상, 홈팀이 앞서 있으면 말 공격 없이 종료
      if (game.inning >= TOTAL_INNINGS && game.runs.home > game.runs.away) { game.over = true; return; }
      game.half = "bottom";
      setPhase("half-end", 1400);
    } else {
      if (game.inning >= TOTAL_INNINGS && game.runs.home !== game.runs.away) { game.over = true; return; }
      if (game.inning >= MAX_INNINGS) { game.over = true; return; }
      game.inning++; game.half = "top";
      setPhase("half-end", 1400);
    }
  }

  // ===================== 투구 =====================
  function pickPitchTypeAI(p) {
    const arsenal = p.arsenal;
    const r = Math.random();
    if (game.strikes === 2 && r < 0.55) {
      const breaking = arsenal.filter(function (k) { return k !== "fastball"; });
      if (breaking.length) return breaking[Math.floor(Math.random() * breaking.length)];
    }
    if (r < 0.45) return "fastball";
    return arsenal[Math.floor(Math.random() * arsenal.length)];
  }

  function aiTarget() {
    // 카운트에 따라 존 안/밖을 노림
    const cx = ZONE.x + ZONE.w / 2, cy = ZONE.y + ZONE.h / 2;
    const mustStrike = game.balls === 3;
    const ahead = game.strikes === 2 && game.balls < 3;
    if (mustStrike) return { x: cx + gauss(10), y: cy + gauss(12) };
    if (ahead && Math.random() < 0.55) {
      // 유인구: 존 바로 바깥
      const side = Math.random() < 0.5 ? -1 : 1;
      const vside = Math.random() < 0.5 ? -1 : 1;
      return {
        x: cx + side * (ZONE.w / 2) * (1.05 + Math.random() * 0.35),
        y: cy + vside * (ZONE.h / 2) * (0.8 + Math.random() * 0.5)
      };
    }
    // 존 가장자리 공략
    return {
      x: cx + (Math.random() < 0.5 ? -1 : 1) * (ZONE.w / 2) * (0.2 + Math.random() * 0.62),
      y: cy + (Math.random() < 0.5 ? -1 : 1) * (ZONE.h / 2) * (0.2 + Math.random() * 0.62)
    };
  }

  function staminaRatio(p) { return clamp(p.stamina / p.max, 0, 1); }

  // 좌우 관련 도우미
  const SHOULDER = { x: 8, y: -72 }, ARM_LEN = 30;
  function handOffset(angle) {
    return { x: SHOULDER.x + Math.cos(angle) * ARM_LEN, y: SHOULDER.y + Math.sin(angle) * ARM_LEN };
  }
  function releasePoint(p) {
    // 실제로 그려지는 손 위치에서 공이 나가도록 계산
    const mp = fieldPos(MOUND_DISTANCE, 0);
    const h = handOffset(armSlot(p).angle);
    const sign = p.hand === "R" ? -1 : 1;     // 포수 시점: 우완의 팔은 화면 왼쪽
    return { x: mp.x + sign * h.x, y: mp.y + 4 + h.y };
  }
  // 같은 손 대결이면 타자가 불리 (공이 등 뒤에서 들어오고 변화구가 도망간다)
  function platoonFactor(b, p) {
    // 같은 손 대결은 타자가 불리하고, 사이드암·언더핸드면 더 까다롭다
    return b.hand === p.hand ? 0.9 * armSlot(p).platoon : 1.08;
  }

  // 현재 투수의 제구 흔들림 반경(px) — 조준 원과 실제 흔들림이 같은 값을 쓴다
  function controlSigma(p) {
    return (1 - p.control) * 34 + (1 - staminaRatio(p)) * 40 + 5;
  }

  function throwPitch(typeKey, aim) {
    const p = currentPitcher();
    const type = PITCH_TYPES[typeKey];
    const sr = staminaRatio(p);

    const sigma = controlSigma(p);
    const fx = aim.x + gauss(sigma);
    const fy = aim.y + gauss(sigma * 0.9);

    const slot = armSlot(p);
    const sp = type.speed[0] + Math.random() * (type.speed[1] - type.speed[0]) - (1 - sr) * 9 + slot.speed;
    const flight = (MOUND_DISTANCE / (sp / 3.6)) * 1000 * TIME_SCALE;

    // 체력 소모: 주자가 많을수록 빨리 닳음
    const cost = type.cost * (1 + 0.28 * runnersOn()) * (1 + (game.outs === 2 ? 0 : 0.02));
    p.stamina = Math.max(0, p.stamina - cost);
    p.pitches++;

    const cpuBatterSwing = isOnline() ? null : planCpuSwing(type, { x: fx, y: fy }, flight);
    const rp = releasePoint(p);

    anim.pitch = {
      type: type, speed: Math.round(sp), flight: flight, elapsed: 0,
      fx: fx, fy: fy, aim: aim, swung: false, swingAt: cpuBatterSwing,
      staminaAtThrow: sr, rx: rp.x, ry: rp.y,
      bx: type.bx * slot.bx * (p.hand === "L" ? -1 : 1), by: type.by * slot.by, hand: p.hand
    };
    cpuStealDecision();
    anim.batSwing = 0;          // 이전 스윙 자세가 남지 않게 초기화
    ui.message = "";
    if (isOnline() && userIsPitching()) {
      const a = anim.pitch;
      netSend({ t: "pitch", type: typeKey, fx: a.fx, fy: a.fy, speed: a.speed, flight: a.flight,
        rx: a.rx, ry: a.ry, bx: a.bx, by: a.by, hand: a.hand });
    }
    setPhase("wind", 750);
  }

  function pitchPoint(t) {
    const pt = anim.pitch;
    const z = Math.max(0, 1 - t) * MOUND_DISTANCE;
    const s = 1 / (1 + z * 0.5), s0 = 1 / (1 + MOUND_DISTANCE * 0.5);
    const k = (s - s0) / (1 - s0);
    const bow = Math.pow(t, 1) - Math.pow(t, pt.type.late);
    return {
      x: pt.rx + (pt.fx - pt.rx) * k - pt.bx * bow,
      y: pt.ry + (pt.fy - pt.ry) * k - pt.by * bow,
      r: 2.5 + 13 * k, k: k
    };
  }

  function inZone(x, y) {
    return x >= ZONE.x && x <= ZONE.x + ZONE.w && y >= ZONE.y && y <= ZONE.y + ZONE.h;
  }
  function zoneMiss(x, y) {
    // 존 중심에서 얼마나 벗어났는지 (0 = 한가운데, 1 = 존 경계)
    const dx = Math.abs(x - (ZONE.x + ZONE.w / 2)) / (ZONE.w / 2);
    const dy = Math.abs(y - (ZONE.y + ZONE.h / 2)) / (ZONE.h / 2);
    return Math.max(dx, dy);
  }

  // CPU 타자의 스윙 계획 (유저가 투구할 때)
  function planCpuSwing(type, loc, flight) {
    const b = currentBatter();
    const miss = zoneMiss(loc.x, loc.y);
    let prob;
    if (miss <= 1) prob = 0.52 + 0.28 * b.contact;
    else prob = clamp(0.42 - (miss - 1) * 0.55, 0.03, 0.42);
    if (game.strikes === 2) prob = Math.min(0.96, prob + 0.33);
    if (game.balls === 3 && game.strikes < 2) prob *= 0.55;
    if (Math.random() > prob) return null;

    const sigma = (38 + type.dec * 12 + (1 - b.contact) * 40) / platoonFactor(b, currentPitcher());
    return flight + gauss(sigma);
  }

  // ===================== 타격 판정 =====================
  function contactQuality(offsetMs, loc, b) {
    const a = Math.abs(offsetMs);
    const miss = zoneMiss(loc.x, loc.y);
    const locFactor = miss <= 1 ? 1 : clamp(1 - (miss - 1) * 0.8, 0.15, 1);
    // 존에서 벗어난 공 + 컨택 능력 + 좌우 상성이 배트에 맞히는 여유를 정한다
    const skill = 0.6 + b.contact * 0.55;
    const win = CONTACT_WINDOW * (0.5 + 0.5 * locFactor) * skill * platoonFactor(b, currentPitcher());
    if (a > win) return null;                               // 헛스윙

    const acc = clamp((1 - a / win) * locFactor, 0, 1);
    if (acc < 0.18 && Math.random() < 0.5) return null;      // 스쳤지만 헛스윙

    const exit = 78 + Math.pow(acc, 1.55) * (72 + b.power * 30) + gauss(7);
    const angle = 9 + gauss(17) + acc * 9;                   // 실제 타구 발사각 분포에 맞춤
    const handSign = b.hand === "L" ? -1 : 1;
    const spray = clamp(offsetMs * 0.55 * handSign + gauss(10), -55, 55);
    return { exit: Math.round(exit), angle: Math.round(angle), spray: Math.round(spray), acc: acc, offset: Math.round(offsetMs) };
  }

  // 타구 → 수비 시뮬레이션
  function resolveBattedBall(c) {
    const v = c.exit / 3.6;
    const angRad = Math.max(1, c.angle) * Math.PI / 180;
    const grounder = c.angle < 8;
    let dist, hang;

    if (grounder) {
      dist = clamp(v * 1.15, 6, 95);
      hang = 0.25;
    } else {
      dist = (v * v * Math.sin(2 * angRad) / 9.8) * 0.62;
      hang = (2 * v * Math.sin(angRad) / 9.8) * 0.92;
    }
    dist = Math.max(2, dist);

    const out = { exit: c.exit, angle: c.angle, spray: c.spray, distance: Math.round(dist), hang: hang, grounder: grounder };
    // 주자 시간은 어떤 결과든 필요하므로 조기 return 이전에 계산한다
    out.runTime = 4.55 - currentBatter().speed * 1.0;

    // 파울: 파울 라인 밖으로 가거나, 빗맞은 타구는 높은 확률로 파울
    const foulChance = clamp(0.52 - (c.acc || 0) * 0.46, 0.05, 0.52);
    if (Math.abs(c.spray) > 45 || Math.random() < foulChance) {
      out.kind = "foul"; out.text = "파울"; return out;
    }

    if (!grounder && dist >= fenceDistance(c.spray) && c.angle >= 15 && c.angle <= 52) {
      out.kind = "homerun"; out.text = "홈런!"; out.fielder = null; return out;
    }

    const land = polar(dist, c.spray);
    let bestT = 999, bestF = null;
    POSITIONS.forEach(function (f) {
      const fp = polar(f.dist, f.ang);
      const run = Math.hypot(land.x - fp.x, land.y - fp.y);
      const t = run / f.speed + 0.35;
      if (t < bestT) { bestT = t; bestF = f; }
    });
    out.fielder = bestF ? bestF.pos : "CF";
    out.reach = bestT;

    const bat = currentBatter();
    if (!grounder) {
      if (bestT <= hang - 0.1) {
        out.kind = c.angle >= 22 ? "flyout" : "lineout";
        out.text = (c.angle >= 22 ? "뜬공 아웃" : "직선타 아웃") + " (" + POS_NAME[out.fielder] + ")";
        out.caught = true;
        return out;
      }
      if (dist >= 76 && bestT > hang + 0.35 && bat.speed > 0.6 && Math.abs(c.spray) > 10) {
        out.kind = "triple"; out.text = "3루타!"; return out;
      }
      if (dist >= 62 || bestT > hang + 1.0) { out.kind = "double"; out.text = "2루타!"; return out; }
      out.kind = "single"; out.text = "안타!";
      return out;
    }

    // 땅볼 처리
    const infield = POSITIONS.filter(function (f) { return ["P", "1B", "2B", "SS", "3B"].indexOf(f.pos) >= 0; });
    const ballSpeed = Math.max(6, v * 0.52);   // 땅볼은 잔디에서 크게 감속한다
    let handler = null, handleT = 999;
    infield.forEach(function (f) {
      const fp = polar(f.dist, f.ang);
      // 타구 직선과 야수 사이 거리
      const along = (fp.x * land.x + fp.y * land.y) / Math.max(1, dist);
      if (along < 0 || along > dist + 4) return;
      const px = land.x / dist * along, py = land.y / dist * along;
      const lateral = Math.hypot(fp.x - px, fp.y - py);
      const ballT = along / ballSpeed;
      if (lateral <= (ballT + 0.45) * f.speed) {
        const t = Math.max(ballT, lateral / f.speed) + 0.45;
        if (t < handleT) { handleT = t; handler = f; }
      }
    });

    const runTime = out.runTime;

    if (!handler) {
      out.kind = "single";
      out.fielder = Math.abs(c.spray) > 18 ? (c.spray < 0 ? "LF" : "RF") : "CF";
      out.text = "안타! (외야로 빠지는 타구)";
      return out;
    }

    out.fielder = handler.pos;
    out.fieldSpot = { d: handler.dist, ang: handler.ang };
    out.throwPlay = true;
    const fp = polar(handler.dist, handler.ang);
    const throwDist = Math.hypot(fp.x - polar(27.4, 45).x, fp.y - polar(27.4, 45).y);
    const total = handleT + 0.75 + throwDist / 28;   // 포구 후 송구 동작 + 송구 비행
    out.fieldAt = handleT + 0.45;                    // 야수가 공을 잡는 시점
    out.throwAt = total;                             // 송구가 1루에 닿는 시점

    if (Math.random() < 0.03) {
      out.kind = "error"; out.text = "실책! (" + POS_NAME[handler.pos] + ")";
      return out;
    }
    if (total < runTime) {
      out.kind = "groundout";
      out.text = "땅볼 아웃 (" + POS_NAME[handler.pos] + ")";
      out.dpChance = handler.pos !== "1B" && total < runTime - 0.35;
      return out;
    }
    out.kind = "single";
    out.text = "내야 안타!";
    return out;
  }

  // ===================== 주자/점수 처리 =====================
  let runnerSeq = 0;
  function makeRunner(b) { return { p: b, id: ++runnerSeq }; }

  function forceAdvance(batterRunner) {
    // 볼넷 등 밀어내기
    let runs = 0;
    if (game.bases[0]) {
      if (game.bases[1]) {
        if (game.bases[2]) runs++;
        game.bases[2] = game.bases[1];
      }
      game.bases[1] = game.bases[0];
    }
    game.bases[0] = batterRunner;
    return runs;
  }

  // nBases: 주자가 기본으로 진루하는 베이스 수, deep: 2루 이상 주자 한 베이스 추가
  function advanceRunners(nBases, deep) {
    let runs = 0;
    const nb = [null, null, null];
    for (let i = 2; i >= 0; i--) {
      const r = game.bases[i];
      if (!r) continue;
      const target = (i + 1) + nBases + (deep && i >= 1 ? 1 : 0);
      if (target >= 4) runs++;
      else nb[target - 1] = r;
    }
    game.bases = nb;
    return runs;
  }

  function findBase(r) {
    for (let i = 0; i < 3; i++) if (game.bases[i] === r) return i + 1;
    return null;
  }

  function buildRunnerAnim(before, batterRunner, scored, kind) {
    const list = [];
    const scoringPlay = scored > 0;
    before.forEach(function (r, i) {
      if (!r) return;
      const to = findBase(r);
      if (to !== null) list.push({ from: i + 1, to: to });
      else if (scoringPlay) list.push({ from: i + 1, to: 4 });
      else list.push({ from: i + 1, to: i + 1, out: true });
    });
    const bt = findBase(batterRunner);
    if (bt !== null) list.push({ from: 0, to: bt });
    else if (kind === "homerun") list.push({ from: 0, to: 4 });
    else if (kind !== "strikeout") list.push({ from: 0, to: 1, out: true });
    anim.runnerAnim = list;
  }

  function applyPlay(res) {
    const b = currentBatter();
    const teamKey = game.half === "top" ? "away" : "home";
    const before = game.bases.slice();
    const br = makeRunner(b);
    let runs = 0, outsAdded = 0, extra = "";
    b.ab++;

    switch (res.kind) {
      case "homerun": {
        runs = 1 + runnersOn();
        game.bases = [null, null, null];
        game.hits[teamKey]++; b.hit++; b.rbi += runs;
        extra = runs === 4 ? "만루 홈런!" : (runs > 1 ? runs + "점 홈런!" : "솔로 홈런!");
        break;
      }
      case "triple":
        runs = advanceRunners(3);
        game.bases[2] = br;
        game.hits[teamKey]++; b.hit++; b.rbi += runs;
        break;
      case "double":
        runs = advanceRunners(2);
        game.bases[1] = br;
        game.hits[teamKey]++; b.hit++; b.rbi += runs;
        break;
      case "single":
        runs = advanceRunners(1, res.distance > 55 || (res.distance > 38 && Math.random() < 0.3));
        game.bases[0] = br;
        game.hits[teamKey]++; b.hit++; b.rbi += runs;
        break;
      case "error":
        runs = advanceRunners(1);
        game.bases[0] = br;
        game.errors[game.half === "top" ? "home" : "away"]++;
        break;
      case "walk":
        runs = forceAdvance(br);
        b.rbi += runs;
        break;
      case "strikeout":
        outsAdded = 1;
        currentPitcher().k++;
        break;
      case "flyout": {
        outsAdded = 1;
        // 희생플라이
        if (game.bases[2] && game.outs + outsAdded < 3 && res.distance > 62) {
          runs++; game.bases[2] = null; b.rbi++;
          extra = "희생플라이";
        }
        break;
      }
      case "lineout":
        outsAdded = 1;
        break;
      case "groundout": {
        outsAdded = 1;
        const dp = res.dpChance && game.bases[0] && game.outs + 1 < 3 && Math.random() < 0.62;
        if (dp) {
          // 1루 주자 + 타자 아웃, 나머지 주자는 한 베이스 진루
          outsAdded = 2;
          extra = "병살타!";
          const r2 = game.bases[1], r3 = game.bases[2];
          game.bases = [null, null, null];
          if (r3) { if (game.outs + outsAdded < 3) { runs++; b.rbi++; } }
          if (r2) game.bases[2] = r2;
        } else {
          const r1 = game.bases[0], r2 = game.bases[1], r3 = game.bases[2];
          game.bases = [null, null, null];
          if (r3) {
            if (game.outs + outsAdded < 3 && Math.random() < 0.55) { runs++; b.rbi++; extra = "내야 땅볼 득점"; }
            else game.bases[2] = r3;
          }
          if (r2) { if (!game.bases[2]) game.bases[2] = r2; else game.bases[1] = r2; }
          if (r1) { if (!game.bases[1]) game.bases[1] = r1; else game.bases[0] = r1; }
        }
        break;
      }
    }

    buildRunnerAnim(before, br, runs, res.kind);

    addRuns(runs);
    game.outs += outsAdded;

    const label = (extra ? extra + " " : "") + (runs > 0 ? "(" + runs + "점)" : "");
    game.log.unshift(game.inning + "회 " + (game.half === "top" ? "초" : "말") + " " + b.name + " " + res.text + (label ? " " + label : ""));
    if (game.log.length > 6) game.log.pop();

    battingTeam().order = (battingTeam().order + 1) % 9;
    game.balls = 0; game.strikes = 0;

    return { runs: runs, outsAdded: outsAdded, extra: extra };
  }

  // ===================== 페이즈 =====================
  function setPhase(p, dur) {
    anim.phase = p;
    anim.time = 0;
    anim.dur = dur || 0;
  }

  function nextBatter() {
    if (game.over) { setPhase("game-end", 0); return; }
    if (game.outs >= 3) { endHalf(); if (game.over) setPhase("game-end", 0); return; }
    if (checkGameEnd()) { setPhase("game-end", 0); return; }

    // CPU 투수 교체 판단
    const ft = fieldingTeam();
    if (!isOnline() && ft !== (iAmHome() ? HOME_TEAM : AWAY_TEAM)) {
      const p = ft.staff[ft.pitcherIdx];
      if (staminaRatio(p) < 0.22 && ft.pitcherIdx < ft.staff.length - 1) {
        ft.pitcherIdx++;
        ui.message = ft.short + " 투수 교체 → " + ft.staff[ft.pitcherIdx].name;
      }
    }

    anim.batSwing = 0;
    anim.pitch = null;
    anim.play = null;
    game.pitchLog = [];
    cam.tx = W / 2; cam.ty = H / 2; cam.tscale = 1;

    ui.message = "";
    if (userIsPitching()) setPhase("aim", 0);
    else setPhase("set", 700);
  }

  function beginCpuPitch() {
    const p = currentPitcher();
    const key = pickPitchTypeAI(p);
    throwPitch(key, aiTarget());
  }

  // 투구 결과 처리 (스윙/견제 없이 포수 미트까지 간 경우 포함)
  function finishPitch(kindHint) {
    anim.pendingCount = kindHint;
    const st = resolveSteals();
    if (st) {
      anim.stealResult = st;
      netSendOutcome("count", null, { steal: st, call: "" });
      setPhase("steal", 1200);
      return;
    }
    applyCount();
  }

  function netSendOutcome(kind, res, extra) {
    if (!isOnline() || !userIsPitching()) return;
    const msg = { t: "outcome", kind: kind, snap: snapshot() };
    if (res) msg.res = res;
    if (extra) { for (const k in extra) msg[k] = extra[k]; }
    netSend(msg);
  }

  function applyCount() {
    const kindHint = anim.pendingCount;
    const pt = anim.pitch;
    const loc = { x: pt.fx, y: pt.fy };
    const strike = inZone(loc.x, loc.y);

    if (kindHint === "swing-miss") {
      game.strikes++;
      ui.message = "헛스윙";
      logPitch(loc, "swing");
    } else if (kindHint === "take") {
      if (strike) { game.strikes++; ui.message = "스트라이크"; logPitch(loc, "strike"); }
      else { game.balls++; ui.message = "볼"; logPitch(loc, "ball"); }
    }

    if (game.strikes >= 3) {
      const res = { kind: "strikeout", text: "삼진 아웃" };
      const r = applyPlay(res);
      anim.play = { res: res, info: r };
      netSendOutcome("count", null, { call: ui.message, play: res, info: r });
      setPhase("play", 1500);
      return;
    }
    if (game.balls >= 4) {
      const res = { kind: "walk", text: "볼넷" };
      const r = applyPlay(res);
      anim.play = { res: res, info: r };
      netSendOutcome("count", null, { call: ui.message, play: res, info: r });
      setPhase("play", 1500);
      return;
    }
    netSendOutcome("count", null, { call: ui.message });
    // 다음 투구
    if (userIsPitching()) setPhase("aim", 0);
    else setPhase("set", 650);
  }

  function logPitch(loc, call) {
    game.pitchLog.push({ x: loc.x, y: loc.y, call: call, n: game.pitchLog.length + 1 });
    if (game.pitchLog.length > 8) game.pitchLog.shift();
  }

  function doSwing(offsetMs) {
    const pt = anim.pitch;
    game.steals = [];
    pt.swung = true;
    anim.batSwing = 0.0001;
    const b = currentBatter();
    const c = contactQuality(offsetMs, { x: pt.fx, y: pt.fy }, b);

    if (!c) { setPhase("catch", 420); anim.pendingResult = "swing-miss"; return; }

    const res = resolveBattedBall(c);
    res.offset = c.offset;
    res.timing = timingLabel(c.offset);

    if (res.kind === "foul") {
      if (game.strikes < 2) game.strikes++;
      ui.message = "파울";
      logPitch({ x: pt.fx, y: pt.fy }, "foul");
      anim.contact = c;
      flash = 1; shake = 4;
      netSendOutcome("foul");
      setPhase("foul", 900);
      return;
    }

    logPitch({ x: pt.fx, y: pt.fy }, "hit");
    flash = 1;
    shake = res.kind === "homerun" ? 12 : 6;
    anim.contact = c;
    anim.batted = res;
    startBallFlight(res);
    setPhase("flight", 0);
    if (isOnline() && userIsPitching()) netSendOutcome("play", res);
  }

  function startBallFlight(res) {
    const throwPlay = !!res.throwPlay;
    const TIME_ZOOM = 0.52;                 // 실제 초 → 애니메이션 (비율은 그대로)
    let endSec, splitT, arriveT, runT;
    if (throwPlay) {
      // 송구 도착과 주자 도착 순서가 판정과 정확히 일치하도록 같은 시계를 쓴다
      endSec = Math.max(res.throwAt, res.runTime) + 0.4;
      splitT = res.fieldAt / endSec;
      arriveT = res.throwAt / endSec;
      runT = res.runTime / endSec;
    } else {
      endSec = Math.max(res.hang || 1.2, 1.1) + 0.3;
      splitT = 1; arriveT = 1;
      runT = Math.min(1, (res.runTime || 4.1) / endSec);
    }
    anim.ballFlight = {
      t: 0,
      dur: endSec * 1000 * TIME_ZOOM,
      splitT: splitT, arriveT: arriveT, runT: runT,
      dist: res.distance, spray: res.spray, angle: res.angle,
      caught: !!res.caught,
      throwPlay: throwPlay,
      fieldD: res.fieldSpot ? res.fieldSpot.d : res.distance,
      fieldAng: res.fieldSpot ? res.fieldSpot.ang : res.spray,
      peak: res.grounder ? 1.2 : Math.max(2, res.distance * Math.tan(Math.max(8, res.angle) * Math.PI / 180) / 4)
    };
    anim.fielderAnim = POSITIONS.map(function (f) { return { pos: f.pos, ang: f.ang, dist: f.dist, t: 0 }; });
  }

  function timingLabel(offset) {
    const a = Math.abs(offset);
    const dir = offset < 0 ? "빠름" : "늦음";
    if (a <= 12) return "완벽한 타이밍!";
    if (a <= 30) return "좋은 타이밍 · " + dir;
    if (a <= 55) return "살짝 " + dir;
    return "많이 " + dir;
  }

  function finishBattedBall() {
    const res = anim.batted;
    if (isOnline() && !userIsPitching()) {
      // 판정은 상대가 확정했다 — 받은 스냅샷을 적용만 한다
      if (anim.pendingSnap) { applySnapshot(anim.pendingSnap); anim.pendingSnap = null; }
      anim.play = { res: res, info: { runs: 0, extra: "" } };
      setPhase("play", 1900);
      return;
    }
    const r = applyPlay(res);
    anim.play = { res: res, info: r };
    setPhase("play", 1900);
  }

  // ===================== 업데이트 =====================
  function update(dt) {
    if (shake > 0) shake = Math.max(0, shake - dt * 0.04);
    if (flash > 0) flash = Math.max(0, flash - dt * 0.006);
    if (anim.batSwing > 0 && anim.batSwing < 1) anim.batSwing = Math.min(1, anim.batSwing + dt / 190);

    cam.x += (cam.tx - cam.x) * Math.min(1, dt / 120);
    cam.y += (cam.ty - cam.y) * Math.min(1, dt / 120);
    cam.scale += (cam.tscale - cam.scale) * Math.min(1, dt / 160);

    anim.time += dt;
    const p = anim.phase;

    if (p === "title" || p === "game-end" || p === "aim") return;

    // 입력 대기 페이즈가 아닌데 너무 오래 머물면 스스로 진행을 복구한다
    if (anim.time > 12000) {
      noteError("stall", new Error("진행 정지: " + p));
      recoverFromError();
      return;
    }

    if (p === "half-start") {
      if (anim.time >= anim.dur) nextBatter();
    } else if (p === "half-end") {
      if (anim.time >= anim.dur) startHalf();
    } else if (p === "set") {
      // 온라인에서는 상대(수비 쪽)가 던진 공이 올 때까지 기다린다
      if (anim.time >= anim.dur && !isOnline()) beginCpuPitch();
    } else if (p === "wind") {
      if (anim.time >= anim.dur) setPhase("pitch", 0);
    } else if (p === "pitch") {
      const pt = anim.pitch;
      pt.elapsed += dt;
      if (!pt.swung && pt.swingAt !== null && pt.swingAt !== undefined &&
          userIsPitching() && pt.elapsed >= pt.swingAt) {
        doSwing(pt.elapsed - pt.flight);
        return;
      }
      if (pt.elapsed > pt.flight + CONTACT_WINDOW + 40) {
        if (isOnline() && !userIsPitching()) {
          if (!pt.sentTake) { pt.sentTake = true; netSend({ t: "take" }); }
          if (!pt.swung) setPhase("catch", 380);       // 애니메이션만, 판정은 상대가
        } else {
          anim.pendingResult = "take";
          setPhase("catch", 380);
        }
      }
    } else if (p === "steal") {
      if (anim.time >= anim.dur) {
        if (game.outs >= 3) { endHalf(); if (game.over) setPhase("game-end", 0); return; }
        applyCount();
      }
    } else if (p === "catch") {
      if (anim.time >= anim.dur) finishPitch(anim.pendingResult);
    } else if (p === "foul") {
      if (anim.time >= anim.dur) {
        if (userIsPitching()) setPhase("aim", 0); else setPhase("set", 650);
      }
    } else if (p === "flight") {
      const f = anim.ballFlight;
      f.t = Math.min(1, f.t + dt / f.dur);
      const bp = battedBallScreen(f.t);
      cam.tx = clamp(bp.x, 200, W - 200);
      cam.ty = clamp(bp.y + 40, 150, H - 150);
      cam.tscale = 1.18;
      anim.fielderAnim.forEach(function (fa) { fa.t = Math.min(1, f.t * 1.25); });
      if (f.t >= 1) {
        cam.tx = W / 2; cam.ty = H / 2; cam.tscale = 1;
        finishBattedBall();
      }
    } else if (p === "play") {
      if (anim.time >= anim.dur) {
        if (checkGameEnd()) { setPhase("game-end", 0); return; }
        if (game.outs >= 3) {
          endHalf();
          if (game.over) setPhase("game-end", 0);
          return;
        }
        nextBatter();
      }
    }
  }

  function battedBallScreen(t) {
    const f = anim.ballFlight;
    if (f.throwPlay && t > f.splitT) {
      // 야수 → 1루 송구
      const u = clamp((t - f.splitT) / Math.max(0.01, f.arriveT - f.splitT), 0, 1);
      const a = fieldPos(f.fieldD, f.fieldAng), b = fieldPos(27.4, 45);
      return {
        x: a.x + (b.x - a.x) * u,
        y: a.y + (b.y - a.y) * u - Math.sin(u * Math.PI) * 30,
        r: 5.5, d: f.dist, throwing: u < 1
      };
    }
    const u = f.throwPlay ? t / f.splitT : t;
    const d = (f.throwPlay ? f.fieldD : f.dist) * u;
    const ang = f.throwPlay ? f.spray + (f.fieldAng - f.spray) * u : f.spray;
    // 잡히는 타구는 글러브 높이에서 멈춘다
    const h = f.peak * 4 * u * (1 - u) + (f.caught ? 1.7 * u : 0);
    const pos = fieldPos(d, ang);
    return { x: pos.x, y: pos.y - h * pxPerM(d) * 0.55, r: Math.max(2.5, 13 - 10 * u), d: d };
  }

  // ===================== 입력 =====================
  function canvasPoint(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (canvas.width / rect.width),
      y: (e.clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  function startBotGame() {
    ui.mode = "bot";
    setTeams(ui.myTeam, ui.oppTeam);
    newGame();
  }

  function menuClick(pt) {
    if (ui.menu === "mode") {
      for (let i = 0; i < MODE_BTN.length; i++) {
        if (inRect(pt, MODE_BTN[i])) {
          ui.mode = MODE_BTN[i].id;
          ui.pickStep = 0;
          ui.menu = "team";
          return;
        }
      }
      return;
    }
    if (ui.menu === "team") {
      if ((ui.pickStep === 1 || ui.mode === "online") && inRect(pt, BACK_BTN)) {
        if (ui.pickStep === 1) ui.pickStep = 0; else ui.menu = "mode";
        return;
      }
      for (let i = 0; i < TEAM_DATA.length; i++) {
        if (!inRect(pt, teamCardRect(i))) continue;
        const id = TEAM_DATA[i].short;
        if (ui.mode === "online") { ui.myTeam = id; ui.menu = "room"; return; }
        if (ui.pickStep === 0) { ui.myTeam = id; ui.pickStep = 1; return; }
        if (id === ui.myTeam) return;              // 같은 팀끼리는 불가
        ui.oppTeam = id;
        startBotGame();
        return;
      }
      return;
    }
    if (ui.menu === "room") { roomMenuClick(pt); return; }
    if (ui.menu === "wait") { waitMenuClick(pt); return; }
  }

  function menuHover(pt) {
    ui.hover = null;
    if (ui.menu === "mode") {
      MODE_BTN.forEach(function (b) { if (inRect(pt, b)) ui.hover = b.id; });
    } else if (ui.menu === "team") {
      for (let i = 0; i < TEAM_DATA.length; i++) {
        if (inRect(pt, teamCardRect(i))) ui.hover = "team" + i;
      }
    } else if (ui.menu === "room") {
      ROOM_BTN.forEach(function (b) { if (inRect(pt, b)) ui.hover = b.id; });
    }
  }

  function handleClick(pt) {
    if (anim.phase === "title") { menuClick(pt); return; }
    if (anim.phase === "game-end") { anim.phase = "title"; ui.menu = "mode"; ui.pickStep = 0; netClose(); return; }

    if (ui.showSub) {
      const idx = subButtonAt(pt);
      if (idx !== null) {
        if (idx >= 0) {
          const t = myTeam();
          t.pitcherIdx = idx;
          ui.message = "투수 교체 → " + t.staff[idx].name;
          if (isOnline()) netSend({ t: "sub", home: iAmHome(), idx: idx });
        }
        ui.showSub = false;
      }
      return;
    }

    if (anim.phase === "aim") {
      // 구종 버튼
      const bi = pitchButtonAt(pt);
      if (bi !== null) { ui.selectedPitch = bi; return; }
      if (subButtonHit(pt)) { ui.showSub = true; return; }
      // 존 클릭 = 그 위치로 투구
      if (pt.x > ZONE.x - 110 && pt.x < ZONE.x + ZONE.w + 110 && pt.y > ZONE.y - 90 && pt.y < ZONE.y + ZONE.h + 90) {
        const p = currentPitcher();
        const key = p.arsenal[clamp(ui.selectedPitch, 0, p.arsenal.length - 1)];
        throwPitch(key, { x: pt.x, y: pt.y });
      }
      return;
    }

    const sb = stealButtonHit(pt);
    if (sb !== null) { toggleSteal(sb); return; }

    if (anim.phase === "pitch" && !userIsPitching() && anim.pitch && !anim.pitch.swung) {
      if (isOnline()) {
        anim.pitch.swung = true;
        anim.batSwing = 0.0001;
        netSend({ t: "swing", offset: Math.round(anim.pitch.elapsed - anim.pitch.flight) });
      } else {
        doSwing(anim.pitch.elapsed - anim.pitch.flight);
      }
    }
  }

  function pitchButtonRects() {
    const p = currentPitcher();
    const rects = [];
    p.arsenal.forEach(function (key, i) {
      rects.push({ key: key, x: 24, y: 306 + i * 44, w: 150, h: 36, i: i });
    });
    return rects;
  }
  function pitchButtonAt(pt) {
    let found = null;
    pitchButtonRects().forEach(function (r) {
      if (pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h) found = r.i;
    });
    return found;
  }
  const SUB_BTN = { x: 24, y: 494, w: 150, h: 36 };
  function subButtonHit(pt) {
    return pt.x >= SUB_BTN.x && pt.x <= SUB_BTN.x + SUB_BTN.w && pt.y >= SUB_BTN.y && pt.y <= SUB_BTN.y + SUB_BTN.h;
  }
  function myTeam() { return iAmHome() ? HOME_TEAM : AWAY_TEAM; }
  function subListRects() {
    return myTeam().staff.map(function (p, i) {
      return { i: i, x: W / 2 - 200, y: 200 + i * 56, w: 400, h: 48, p: p };
    });
  }
  function subButtonAt(pt) {
    let found = null;
    subListRects().forEach(function (r) {
      if (pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h) {
        found = (r.i > myTeam().pitcherIdx) ? r.i : -1;   // 이미 내려간 투수는 복귀 불가
      }
    });
    if (found === null && (pt.y < 180 || pt.y > 200 + myTeam().staff.length * 56)) found = -1;
    return found;
  }

  // ===================== 그리기 =====================
  function roundRect(x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  }

  function drawBall(x, y, r, spin) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(spin || 0);
    ctx.beginPath();
    ctx.fillStyle = "#fdfdfd";
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    if (r > 4) {
      ctx.strokeStyle = "#d9534f";
      ctx.lineWidth = Math.max(1, r * 0.16);
      ctx.beginPath(); ctx.arc(-r * 0.75, 0, r * 1.1, -0.9, 0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(r * 0.75, 0, r * 1.1, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
    }
    ctx.strokeStyle = "rgba(0,0,0,0.25)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  function drawField() {
    const sky = ctx.createLinearGradient(0, 0, 0, WALL_TOP);
    sky.addColorStop(0, "#4f9fd8"); sky.addColorStop(1, "#c3e2f3");
    ctx.fillStyle = sky;
    ctx.fillRect(-400, -200, W + 800, WALL_TOP + 200);

    ctx.fillStyle = "#39434f";
    ctx.fillRect(-400, 86, W + 800, WALL_TOP - 86);
    for (let i = 0; i < 420; i++) {
      const cx = -400 + (i * 61) % (W + 800);
      const cy = 90 + ((i * 17) % (WALL_TOP - 94));
      ctx.fillStyle = ["#6b7a88", "#8b98a4", "#59646f", "#a4b0ba"][i % 4];
      ctx.fillRect(cx, cy, 4, 4);
    }

    ctx.fillStyle = "#1f4d35";
    ctx.fillRect(-400, WALL_TOP, W + 800, WALL_BOTTOM - WALL_TOP);
    ctx.fillStyle = "#f2c94c";
    ctx.fillRect(-400, WALL_TOP, W + 800, 4);
    ctx.font = "bold 15px 'Trebuchet MS', sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.textAlign = "center";
    ctx.fillText("110m", HOME.x, WALL_TOP + 32);
    ctx.fillText("95m", 120, WALL_TOP + 32);
    ctx.fillText("95m", W - 120, WALL_TOP + 32);

    const grass = ctx.createLinearGradient(0, WALL_BOTTOM, 0, H);
    grass.addColorStop(0, "#3f8c4e"); grass.addColorStop(1, "#5aa862");
    ctx.fillStyle = grass;
    ctx.fillRect(-400, WALL_BOTTOM, W + 800, H - WALL_BOTTOM + 200);

    ctx.save();
    ctx.beginPath();
    ctx.rect(-400, WALL_BOTTOM, W + 800, H - WALL_BOTTOM + 200);
    ctx.clip();
    for (let i = -8; i <= 8; i++) {
      ctx.beginPath();
      ctx.fillStyle = i % 2 === 0 ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.04)";
      ctx.moveTo(HOME.x + i * 58, WALL_BOTTOM);
      ctx.lineTo(HOME.x + (i + 1) * 58, WALL_BOTTOM);
      ctx.lineTo(HOME.x + (i + 1) * 230, H + 100);
      ctx.lineTo(HOME.x + i * 230, H + 100);
      ctx.closePath();
      ctx.fill();
    }

    // 내야 흙
    ctx.beginPath();
    ctx.fillStyle = "#b07b4f";
    ctx.moveTo(-120, H + 60);
    ctx.quadraticCurveTo(HOME.x, 250, W + 120, H + 60);
    ctx.closePath();
    ctx.fill();

    // 잔디 내야 (다이아몬드 안쪽)
    const b1 = fieldPos(27.4, 45), b2 = fieldPos(38.8, 0), b3 = fieldPos(27.4, -45);
    ctx.beginPath();
    ctx.fillStyle = "#4e9a5b";
    ctx.moveTo(HOME.x, HOME.y - 6);
    ctx.lineTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y); ctx.lineTo(b3.x, b3.y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 파울 라인
    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 3;
    const fl = fieldPos(FENCE_LINE, -45), fr = fieldPos(FENCE_LINE, 45);
    ctx.beginPath();
    ctx.moveTo(HOME.x - 8, HOME.y); ctx.lineTo(fl.x, fl.y);
    ctx.moveTo(HOME.x + 8, HOME.y); ctx.lineTo(fr.x, fr.y);
    ctx.stroke();

    // 베이스
    [[27.4, 45], [38.8, 0], [27.4, -45]].forEach(function (b) {
      const p = fieldPos(b[0], b[1]);
      const s = 7 * pxPerM(b[0]) / 10 + 4;
      ctx.fillStyle = "#f5f5f5";
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - s * 0.45); ctx.lineTo(p.x + s, p.y);
      ctx.lineTo(p.x, p.y + s * 0.45); ctx.lineTo(p.x - s, p.y);
      ctx.closePath(); ctx.fill();
    });

    // 마운드
    const mp = fieldPos(MOUND_DISTANCE, 0);
    ctx.beginPath();
    ctx.fillStyle = "#c08a5c";
    ctx.ellipse(mp.x, mp.y + 8, 66, 16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#f0f0f0";
    ctx.fillRect(mp.x - 15, mp.y + 4, 30, 4);

    // 타석 + 홈플레이트
    ctx.strokeStyle = "rgba(255,255,255,0.5)";
    ctx.lineWidth = 3;
    ctx.strokeRect(BATTER_X - 66, HOME.y - 12, 132, 56);
    ctx.strokeRect(W - BATTER_X - 66, HOME.y - 12, 132, 56);
    ctx.beginPath();
    ctx.fillStyle = "#f7f7f7";
    ctx.moveTo(HOME.x - 32, HOME.y + 6); ctx.lineTo(HOME.x + 32, HOME.y + 6);
    ctx.lineTo(HOME.x + 21, HOME.y + 24); ctx.lineTo(HOME.x - 21, HOME.y + 24);
    ctx.closePath(); ctx.fill();
  }

  function drawFigure(x, y, scale, jersey, dark, back, pants) {
    const s = scale;
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.ellipse(0, 2 * s, 9 * s, 3 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    // 다리
    ctx.strokeStyle = pants || "#cfd4d9";
    ctx.lineWidth = 3.4 * s;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, -13 * s); ctx.lineTo(-4 * s, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -13 * s); ctx.lineTo(4 * s, 0); ctx.stroke();
    // 몸통
    roundRect(-5.5 * s, -27 * s, 11 * s, 15 * s, 3 * s, jersey, "rgba(0,0,0,0.45)");
    // 팔
    ctx.strokeStyle = jersey;
    ctx.lineWidth = 3 * s;
    ctx.beginPath(); ctx.moveTo(-4 * s, -24 * s); ctx.lineTo(-8 * s, -16 * s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4 * s, -24 * s); ctx.lineTo(8 * s, -16 * s); ctx.stroke();
    // 글러브
    ctx.beginPath(); ctx.fillStyle = "#7b4b2a";
    ctx.arc(-8 * s, -15 * s, 3 * s, 0, Math.PI * 2); ctx.fill();
    // 머리 + 모자
    ctx.beginPath(); ctx.fillStyle = "#e8b88f";
    ctx.arc(0, -32 * s, 4.6 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.fillStyle = dark;
    ctx.arc(0, -33 * s, 4.8 * s, Math.PI, 0); ctx.fill();
    ctx.fillRect(-4.8 * s, -33.4 * s, 9.6 * s, 1.8 * s);
    if (!back) ctx.fillRect(-5.6 * s, -33.4 * s, 3.4 * s, 1.4 * s);
    ctx.restore();
  }

  function drawFielders() {
    const t = fieldingTeam();
    const list = anim.fielderAnim;
    POSITIONS.forEach(function (f, i) {
      if (f.pos === "C") return;
      if (f.pos === "P") return;
      let d = f.dist, ang = f.ang;
      if (list && anim.phase === "flight" && anim.ballFlight) {
        const fa = list[i];
        const bf = anim.ballFlight;
        const land = bf.throwPlay ? polar(bf.fieldD, bf.fieldAng) : polar(bf.dist, bf.spray);
        const fp = polar(f.dist, f.ang);
        // 타구를 처리하는 야수만 실제로 쫓아간다
        const chase = (anim.batted && anim.batted.fielder === f.pos) ? 1.0 : 0.14;
        const nx = fp.x + (land.x - fp.x) * fa.t * chase;
        const ny = fp.y + (land.y - fp.y) * fa.t * chase;
        d = Math.hypot(nx, ny);
        ang = Math.atan2(nx, ny) * 180 / Math.PI;
      }
      const p = fieldPos(d, ang);
      const s = clamp(pxPerM(d) / 8.5, 0.32, 1.25);
      drawFigure(p.x, p.y, s, t.color, t.dark, false, t.pants);
    });
  }

  // 두 마디로 굽은 팔/다리 (무릎·팔꿈치를 자동으로 잡아준다)
  function limb(ax, ay, bx, by, bend, width, color) {
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    const dx = bx - ax, dy = by - ay;
    const len = Math.hypot(dx, dy) || 1;
    const kx = mx - dy / len * bend, ky = my + dx / len * bend;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(0,0,0,0.42)";
    ctx.lineWidth = width + 3;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo(kx, ky, bx, by);
    ctx.stroke();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo(kx, ky, bx, by);
    ctx.stroke();
    return { x: kx, y: ky };
  }

  // 와인드업 → 다리 들기 → 스트라이드 → 릴리스 → 팔로스루
  function armAngleAt(w, f, slot) {
    if (w < 0.32) return slot + 3.5;
    if (w < 0.68) { const u = (w - 0.32) / 0.36; return slot + 3.5 - 1.2 * u; }
    if (w < 1) { const u = (w - 0.68) / 0.32; return slot + 2.3 - 2.3 * Math.pow(u, 0.65); }
    return slot - 1.15 * Math.pow(f, 0.6);
  }

  function drawPitcherFigure() {
    const t = fieldingTeam();
    const p = currentPitcher();
    const slot = armSlot(p);
    const mp = fieldPos(MOUND_DISTANCE, 0);
    const ph = anim.phase;

    let w = 0, f = 0;
    if (ph === "wind") w = Math.min(1, anim.time / Math.max(1, anim.dur));
    else if (ph === "aim" || ph === "set" || ph === "half-start" || ph === "half-end" || ph === "title") w = 0;
    else { w = 1; f = Math.min(1, (anim.pitch ? anim.pitch.elapsed : anim.time) / 450); }

    // 동작 파라미터
    const lift = w < 0.42 ? Math.sin(w / 0.42 * Math.PI * 0.5) : Math.max(0, 1 - (w - 0.42) / 0.22);
    const stride = clamp((w - 0.45) / 0.45, 0, 1);
    const lean = clamp((w - 0.6) / 0.4, 0, 1) * 0.5 + f * 0.5;
    const finish = f;

    ctx.save();
    ctx.translate(mp.x, mp.y + 4 + stride * 3);
    if (p.hand === "R") ctx.scale(-1, 1);
    ctx.scale(1 + stride * 0.05, 1 + stride * 0.05);

    // 그림자
    ctx.beginPath();
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.ellipse(-2, 2, 24, 6.5, 0, 0, Math.PI * 2);
    ctx.fill();

    const hip = { x: stride * 5 - finish * 2, y: -40 + lift * 2 + lean * 3 };
    const shoulder = { x: SHOULDER.x * 0.4 + lean * 4, y: -72 + lean * 5 };
    const headPos = { x: shoulder.x + lean * 5, y: shoulder.y - 15 };

    // 뒷다리(축발): 러버를 밀고 팔로스루에서 들린다
    const backFoot = { x: -8 - finish * 4, y: -finish * 26 };
    limb(hip.x, hip.y, backFoot.x, backFoot.y, 7 + lift * 4, 9, t.pants);

    // 앞다리: 들었다가 홈 쪽(화면 아래)으로 내딛는다
    const frontFoot = lift > 0.05 && stride < 0.05
      ? { x: 14 + lift * 4, y: -34 - lift * 20 }
      : { x: -12 - stride * 14, y: stride * 8 };
    limb(hip.x, hip.y, frontFoot.x, frontFoot.y, lift > 0.05 && stride < 0.05 ? -14 : -6, 9, t.pants);

    // 신발
    function shoe(fx, fy, ang) {
      ctx.save();
      ctx.translate(fx, fy);
      ctx.rotate(ang);
      roundRect(-7, -4, 16, 8, 3, "#22272b");
      ctx.restore();
    }
    shoe(backFoot.x, backFoot.y, finish > 0.1 ? -0.9 : 0);
    shoe(frontFoot.x, frontFoot.y, lift > 0.3 && stride < 0.05 ? -1.1 : 0.1);

    // 몸통
    ctx.save();
    ctx.translate(hip.x, hip.y);
    ctx.rotate(lean * 0.22);
    roundRect(-13, shoulder.y - hip.y, 26, hip.y - shoulder.y + 6, 7, t.color, "rgba(0,0,0,0.45)");
    ctx.fillStyle = t.dark;
    ctx.fillRect(-13, shoulder.y - hip.y + 4, 26, 4);
    ctx.restore();

    // 글러브 팔
    const gloveX = -10 - w * 8 + finish * 12, gloveY = shoulder.y + 8 + w * 6 + finish * 6;
    limb(-SHOULDER.x * 0.6 + shoulder.x, shoulder.y + 4, gloveX, gloveY, 6, 7, t.color);
    ctx.beginPath();
    ctx.fillStyle = "#7b4b2a";
    ctx.arc(gloveX, gloveY, 7, 0, Math.PI * 2);
    ctx.fill();

    // 머리 + 모자
    ctx.beginPath();
    ctx.fillStyle = "#e8b88f";
    ctx.arc(headPos.x, headPos.y, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = t.dark;
    ctx.arc(headPos.x, headPos.y - 2, 10.5, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(headPos.x - 10.5, headPos.y - 3, 21, 3.5);
    ctx.fillRect(headPos.x - 11.5, headPos.y - 3, 6, 2.5);

    // 던지는 팔 (암슬롯에 따라 궤도가 달라진다)
    const ang = armAngleAt(w, f, slot.angle);
    const hand = {
      x: SHOULDER.x + shoulder.x * 0.3 + Math.cos(ang) * ARM_LEN,
      y: shoulder.y + 2 + Math.sin(ang) * ARM_LEN
    };
    limb(SHOULDER.x + shoulder.x * 0.3, shoulder.y + 2, hand.x, hand.y,
      slot.angle > 0 ? 9 : -9, 7.5, t.color);
    // 손
    ctx.beginPath();
    ctx.fillStyle = "#e8b88f";
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.lineWidth = 1.2;
    ctx.arc(hand.x, hand.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 릴리스 전에는 공이 손에 들려 있다
    if (w < 1) {
      ctx.beginPath();
      ctx.fillStyle = "#fdfdfd";
      ctx.strokeStyle = "rgba(0,0,0,0.35)";
      ctx.lineWidth = 1.2;
      ctx.arc(hand.x, hand.y, 4.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawBatterFigure() {
    const t = battingTeam();
    const lefty = currentBatter().hand === "L";
    const sw = anim.batSwing === 0 ? 0 : 1 - Math.pow(1 - anim.batSwing, 3);
    const x = BATTER_X + Math.sin(sw * Math.PI) * 7;
    const g = BATTER_GROUND;

    ctx.save();
    if (lefty) { ctx.translate(2 * HOME.x, 0); ctx.scale(-1, 1); }   // 좌타석으로 반전
    ctx.beginPath(); ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.ellipse(x, g + 6, 44, 10, 0, 0, Math.PI * 2); ctx.fill();

    const hipY = g - 100, shoulderY = g - 176, headY = g - 206;

    roundRect(x - 32, hipY, 28, 78, 10, t.pants, "rgba(0,0,0,0.35)");
    roundRect(x + 6, hipY, 28, 78, 10, t.pants, "rgba(0,0,0,0.35)");
    ctx.fillStyle = t.dark;
    ctx.fillRect(x - 31, hipY + 72, 26, 14);
    ctx.fillRect(x + 7, hipY + 72, 26, 14);
    ctx.fillStyle = "#22272b";
    roundRect(x - 36, g - 12, 34, 14, 4, "#22272b");
    roundRect(x + 4, g - 12, 34, 14, 4, "#22272b");

    ctx.save();
    roundRect(x - 36, shoulderY, 72, hipY - shoulderY + 12, 15, t.color, "rgba(0,0,0,0.5)");
    ctx.clip();
    ctx.fillStyle = "rgba(0,0,0,0.12)";
    for (let i = -3; i <= 3; i++) ctx.fillRect(x + i * 12 - 1, shoulderY, 2, 110);
    ctx.restore();

    ctx.save();
    ctx.translate(x, shoulderY + 56);
    if (lefty) ctx.scale(-1, 1);                                     // 등번호는 뒤집히지 않게
    ctx.fillStyle = t.numberColor;
    ctx.font = "bold 28px 'Trebuchet MS', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String((battingTeam().order + 1)), 0, 0);
    ctx.restore();

    ctx.fillStyle = "#22272b";
    ctx.fillRect(x - 34, hipY - 4, 68, 9);

    ctx.beginPath(); ctx.fillStyle = "#e8b88f";
    ctx.arc(x, headY + 17, 14, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.fillStyle = t.dark;
    ctx.arc(x, headY, 22, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.ellipse(x + 18, headY + 3, 9, 7, 0.3, 0, Math.PI * 2); ctx.fill();

    const pivotX = x + 28, pivotY = shoulderY + 26;
    const angle = -2.05 + sw * 2.6;
    const batLen = 124;

    if (anim.batSwing > 0 && anim.batSwing < 1) {
      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.lineWidth = 11;
      ctx.beginPath();
      ctx.arc(pivotX, pivotY, batLen * 0.82, angle - 1.1, angle);
      ctx.stroke();
    }

    ctx.strokeStyle = t.color; ctx.lineWidth = 16; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x + 11, shoulderY + 15); ctx.lineTo(pivotX, pivotY); ctx.stroke();

    ctx.save();
    ctx.translate(pivotX, pivotY);
    ctx.rotate(angle);
    const grad = ctx.createLinearGradient(0, 0, batLen, 0);
    grad.addColorStop(0, "#7a4a22"); grad.addColorStop(1, "#c98b4b");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, -4); ctx.lineTo(batLen * 0.55, -6); ctx.lineTo(batLen, -9);
    ctx.lineTo(batLen, 9); ctx.lineTo(batLen * 0.55, 6); ctx.lineTo(0, 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#22272b"; ctx.fillRect(-4, -5, 10, 10);
    ctx.restore();

    ctx.beginPath(); ctx.fillStyle = t.dark;
    ctx.arc(pivotX, pivotY, 9, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  const BASE_PTS = [polar(0, 0), polar(27.4, 45), polar(38.8, 0), polar(27.4, -45), polar(0, 0)];
  function runnerFieldPos(p) {
    if (!isFinite(p)) p = 0;
    p = clamp(p, 0, 4);
    const i = Math.min(3, Math.floor(p));
    const f = clamp(p - i, 0, 1);
    const a = BASE_PTS[i], b = BASE_PTS[i + 1];
    const x = a.x + (b.x - a.x) * f, y = a.y + (b.y - a.y) * f;
    return { d: Math.hypot(x, y), ang: Math.atan2(x, y) * 180 / Math.PI };
  }
  const RUNNER_TARGET = { homerun: 4, triple: 3, double: 2, single: 1, error: 1, walk: 1 };
  function batterRunnerProgress() {
    if (anim.phase === "flight" && anim.ballFlight) {
      const f = anim.ballFlight;
      const rt = isFinite(f.runT) && f.runT > 0.05 ? f.runT : 1;
      return Math.min(1, f.t / rt);                       // 실제 주루 시간에 맞춰 달린다
    }
    if (anim.phase === "play" && anim.play) {
      if (anim.play.res.kind === "strikeout") return null;
      const tgt = RUNNER_TARGET[anim.play.res.kind] || 1;
      return 1 + (tgt - 1) * Math.min(1, anim.time / 1200);
    }
    return null;
  }
  function drawRunnerAt(p, t) {
    const rp = runnerFieldPos(p);
    const sp = fieldPos(rp.d, rp.ang);
    const sc = clamp(pxPerM(rp.d) / 8.5, 0.4, 1.5);
    drawFigure(sp.x, sp.y, sc, t.color, t.dark, true, t.pants);
  }

  function drawRunners() {
    const t = battingTeam();
    if (anim.phase === "play" && anim.runnerAnim) {
      const prog = Math.min(1, anim.time / 1200);
      anim.runnerAnim.forEach(function (r) {
        drawRunnerAt(r.from + (r.to - r.from) * prog, t);
      });
      return;
    }
    if (anim.phase === "steal" && anim.stealResult) {
      const prog = Math.min(1, anim.time / 700);
      const movers = anim.stealResult.list.map(function (x) { return x.runner; });
      game.bases.forEach(function (r, i) {
        if (r && movers.indexOf(r) < 0) drawRunnerAt(i + 1 + 0.05, t);
      });
      anim.stealResult.list.forEach(function (x) {
        drawRunnerAt(x.from + (x.to - x.from) * prog, t);
      });
      return;
    }
    // 평소: 베이스에서 리드오프
    game.bases.forEach(function (r, i) {
      if (r) drawRunnerAt(i + 1 + (isStealing(i) ? 0.14 : 0.06), t);
    });
    const bp = batterRunnerProgress();
    if (bp !== null) drawRunnerAt(bp, t);
  }

  function drawZone() {
    if (["aim", "set", "wind", "pitch", "catch"].indexOf(anim.phase) < 0) return;
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.5)";
    ctx.lineWidth = 2;
    ctx.setLineDash([7, 7]);
    ctx.strokeRect(ZONE.x, ZONE.y, ZONE.w, ZONE.h);
    ctx.setLineDash([]);
    if (anim.phase === "aim") {
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.lineWidth = 1;
      for (let i = 1; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(ZONE.x + ZONE.w * i / 3, ZONE.y); ctx.lineTo(ZONE.x + ZONE.w * i / 3, ZONE.y + ZONE.h);
        ctx.moveTo(ZONE.x, ZONE.y + ZONE.h * i / 3); ctx.lineTo(ZONE.x + ZONE.w, ZONE.y + ZONE.h * i / 3);
        ctx.stroke();
      }
      if (ui.hoverZone) {
        const sg = controlSigma(currentPitcher());
        // 제구 흔들림 범위: 체력이 떨어질수록 커진다
        ctx.beginPath();
        ctx.fillStyle = "rgba(255,213,79,0.10)";
        ctx.arc(ui.hoverZone.x, ui.hoverZone.y, sg * 1.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.strokeStyle = "rgba(255,213,79,0.45)"; ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 5]);
        ctx.arc(ui.hoverZone.x, ui.hoverZone.y, sg * 1.6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.strokeStyle = "#ffd54f"; ctx.lineWidth = 2;
        ctx.arc(ui.hoverZone.x, ui.hoverZone.y, 11, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(ui.hoverZone.x - 18, ui.hoverZone.y); ctx.lineTo(ui.hoverZone.x + 18, ui.hoverZone.y);
        ctx.moveTo(ui.hoverZone.x, ui.hoverZone.y - 18); ctx.lineTo(ui.hoverZone.x, ui.hoverZone.y + 18);
        ctx.stroke();
      }
    }

    // 이번 타석 투구 기록
    const CALL_COLOR = { strike: "#ffd54f", ball: "#64b5f6", foul: "#bdbdbd", swing: "#ff8a65", hit: "#ef5350" };
    game.pitchLog.forEach(function (lg, i) {
      const last = i === game.pitchLog.length - 1;
      ctx.beginPath();
      ctx.globalAlpha = last ? 1 : 0.55;
      ctx.fillStyle = CALL_COLOR[lg.call] || "#fff";
      ctx.arc(lg.x, lg.y, last ? 9 : 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.55)"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "#12161b";
      ctx.font = "bold 10px 'Trebuchet MS', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(String(lg.n), lg.x, lg.y + 3.5);
      ctx.globalAlpha = 1;
    });
    ctx.restore();
  }

  function drawPitchedBall() {
    const pt = anim.pitch;
    if (!pt) return;
    const t = Math.min(1.3, pt.elapsed / pt.flight);
    const p = pitchPoint(t);
    for (let i = 3; i >= 1; i--) {
      const bp = pitchPoint(Math.max(0, t - i * 0.05));
      ctx.beginPath();
      ctx.fillStyle = "rgba(255,255,255," + (0.2 - i * 0.045) + ")";
      ctx.arc(bp.x, bp.y, bp.r * 0.9, 0, Math.PI * 2);
      ctx.fill();
    }
    drawBall(p.x, p.y, p.r, pt.elapsed * 0.02);
  }

  function drawCaughtBall() {
    const ct = Math.min(1, anim.time / 180);
    const pt = anim.pitch;
    const mx = HOME.x + 86, my = H - 44;
    drawBall(pt.fx + (mx - pt.fx) * ct, pt.fy + (my - pt.fy) * ct, 15 - ct * 3, anim.time * 0.02);
  }

  function drawBattedBall() {
    const f = anim.ballFlight;
    const bp = battedBallScreen(f.t);
    ctx.strokeStyle = bp.throwing ? "rgba(255,255,255,0.22)" : "rgba(255,255,255,0.35)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 26; i++) {
      const tt = f.t * (i / 26);
      const p = battedBallScreen(tt);
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
    // 그림자
    const gp = fieldPos(f.dist * f.t, f.spray);
    ctx.beginPath();
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.ellipse(gp.x, gp.y, bp.r * 1.2, bp.r * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    drawBall(bp.x, bp.y, bp.r, f.t * 12);

    ctx.font = "bold 18px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    if (bp.throwing) {
      ctx.fillText("1루 송구", bp.x, bp.y - bp.r - 12);
    } else {
      ctx.fillText(Math.round(bp.d) + "m", bp.x, bp.y - bp.r - 12);
    }
    // 포구 순간 반짝임
    if (f.caught && f.t > 0.93) {
      ctx.save();
      ctx.globalAlpha = (f.t - 0.93) / 0.07;
      const g2 = ctx.createRadialGradient(bp.x, bp.y, 2, bp.x, bp.y, 34);
      g2.addColorStop(0, "#fff"); g2.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(bp.x, bp.y, 34, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function drawMiniMap() {
    const cx = 590, cy = 52, s = 34;
    roundRect(cx - 60, 12, 120, 84, 8, "rgba(10,14,18,0.78)");
    const pts = [
      { x: cx, y: cy + s },        // 홈
      { x: cx + s, y: cy },        // 1루
      { x: cx, y: cy - s },        // 2루
      { x: cx - s, y: cy }         // 3루
    ];
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    ctx.lineTo(pts[1].x, pts[1].y); ctx.lineTo(pts[2].x, pts[2].y); ctx.lineTo(pts[3].x, pts[3].y);
    ctx.closePath(); ctx.stroke();

    for (let i = 0; i < 4; i++) {
      const filled = i === 0 ? false : !!game.bases[i - 1];
      ctx.save();
      ctx.translate(pts[i].x, pts[i].y);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = filled ? "#ffd54f" : "rgba(255,255,255,0.22)";
      ctx.fillRect(-7, -7, 14, 14);
      ctx.restore();
    }

    // 주자 애니메이션
    function dot(from, to, t, color) {
      const a = pts[from % 4], b = pts[to % 4];
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.arc(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, 5, 0, Math.PI * 2);
      ctx.fill();
    }
    if (anim.phase === "play" && anim.runnerAnim) {
      const t = Math.min(1, anim.time / 900);
      anim.runnerAnim.forEach(function (r) { dot(r.from, r.to, t, r.out ? "#ef5350" : "#4fc3f7"); });
    } else if (anim.phase === "steal" && anim.stealResult) {
      const pr = Math.min(1, anim.time / 700);
      anim.stealResult.list.forEach(function (x) {
        dot(x.from, x.to, pr, x.ok ? "#4fc3f7" : "#ef5350");
      });
    }

    ctx.textAlign = "center";
    ctx.font = "11px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#9fb0bd";
    ctx.fillText("주자", cx, 92);
  }

  const RELAY_URL = "wss://baseball-relay.ichanu182.workers.dev/";

  let net = null;

  function randomCode() {
    const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let out = "";
    for (let i = 0; i < 4; i++) out += letters[Math.floor(Math.random() * letters.length)];
    return out;
  }

  function netClose() {
    if (net && net.ws) { try { net.ws.close(); } catch (e) {} }
    net = null;
  }

  function netSend(msg) {
    if (net && net.ws && net.ws.readyState === 1) {
      try { net.ws.send(JSON.stringify(msg)); } catch (e) { noteError("netSend", e); }
    }
  }

  function netConnect(code, isHost) {
    netClose();
    net = { ws: null, room: code, isHost: isHost, ready: false, peerTeam: null, peerJoined: false };
    ui.roomCode = code;
    ui.netStatus = "연결 중...";
    let ws;
    try {
      ws = new WebSocket(RELAY_URL + "?room=" + encodeURIComponent(code));
    } catch (e) {
      ui.netStatus = "연결 실패: " + e.message;
      return;
    }
    net.ws = ws;
    ws.onopen = function () {
      ui.netStatus = isHost ? "친구가 들어오기를 기다리는 중" : "방에 참가했습니다";
      netSend({ t: "hello", team: ui.myTeam, host: isHost });
    };
    ws.onmessage = function (ev) {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      try { netHandle(msg); } catch (e) { noteError("netHandle", e); }
    };
    ws.onclose = function () {
      if (net) net.peerJoined = false;
      ui.netStatus = "연결이 끊어졌습니다";
    };
    ws.onerror = function () { ui.netStatus = "연결 오류 (주소를 확인하세요)"; };
    ui.menu = "wait";
  }

  // 내가 지금 수비(투수)인가 — 온라인은 호스트가 홈팀
  function iAmHome() { return ui.mode !== "online" || !net || net.isHost; }

  function netHandle(msg) {
    if (!net) return;
    if (msg.t === "hello") {
      net.peerTeam = msg.team;
      net.peerJoined = true;
      ui.netStatus = "상대 접속: " + teamDataById(msg.team).name;
      // 서로의 팀을 알게 되면 호스트가 경기를 시작한다
      netSend({ t: "hello-ack", team: ui.myTeam, host: net.isHost });
      if (net.isHost) netStartGame();
    } else if (msg.t === "hello-ack") {
      if (!net.peerJoined) {
        net.peerTeam = msg.team;
        net.peerJoined = true;
        ui.netStatus = "상대 접속: " + teamDataById(msg.team).name;
      }
    } else if (msg.t === "start") {
      setTeams(msg.home, msg.away);
      ui.oppTeam = net.isHost ? msg.away : msg.home;
      newGame();
    } else if (msg.t === "pitch") {
      remotePitch(msg);
    } else if (msg.t === "swing") {
      if (anim.phase === "pitch" && anim.pitch && !anim.pitch.swung) doSwing(msg.offset);
    } else if (msg.t === "take") {
      if (anim.phase === "pitch" && anim.pitch && !anim.pitch.swung) {
        anim.pendingResult = "take";
        setPhase("catch", 380);
      }
    } else if (msg.t === "steal") {
      const from = msg.from;
      if (game.bases[from] && !game.steals.some(function (x) { return x.from === from; })) {
        game.steals.push({ from: from, runner: game.bases[from] });
      }
    } else if (msg.t === "sub") {
      const t = msg.home ? HOME_TEAM : AWAY_TEAM;
      if (msg.idx > t.pitcherIdx && msg.idx < t.staff.length) t.pitcherIdx = msg.idx;
    } else if (msg.t === "outcome") {
      remoteOutcome(msg);
    } else if (msg.t === "bye") {
      ui.netStatus = "상대가 나갔습니다";
      net.peerJoined = false;
    }
  }

  function netStartGame() {
    // 호스트가 홈팀, 참가자가 원정팀
    const home = ui.myTeam, away = net.peerTeam;
    netSend({ t: "start", home: home, away: away });
    setTeams(home, away);
    ui.oppTeam = away;
    newGame();
  }

  // ---- 상태 스냅샷: 매 투구마다 수비 쪽이 보내 양쪽 상태를 일치시킨다 ----
  function runnerRef(r) {
    if (!r) return null;
    const isHome = HOME_TEAM.lineup.indexOf(r.p) >= 0;
    const list = isHome ? HOME_TEAM.lineup : AWAY_TEAM.lineup;
    return { h: isHome, i: list.indexOf(r.p), id: r.id };
  }
  function runnerFromRef(ref) {
    if (!ref) return null;
    const list = ref.h ? HOME_TEAM.lineup : AWAY_TEAM.lineup;
    return { p: list[ref.i], id: ref.id };
  }
  function teamSnap(t) {
    return {
      order: t.order, pitcherIdx: t.pitcherIdx,
      bat: t.lineup.map(function (b) { return [b.ab, b.hit, b.rbi, b.sb, b.cs]; }),
      pit: t.staff.map(function (q) { return [Math.round(q.stamina * 10) / 10, q.pitches, q.runs, q.k]; })
    };
  }
  function applyTeamSnap(t, sn) {
    t.order = sn.order; t.pitcherIdx = sn.pitcherIdx;
    sn.bat.forEach(function (v, i) {
      const b = t.lineup[i];
      b.ab = v[0]; b.hit = v[1]; b.rbi = v[2]; b.sb = v[3]; b.cs = v[4];
    });
    sn.pit.forEach(function (v, i) {
      const q = t.staff[i];
      q.stamina = v[0]; q.pitches = v[1]; q.runs = v[2]; q.k = v[3];
    });
  }
  function snapshot() {
    return {
      inning: game.inning, half: game.half, outs: game.outs, balls: game.balls, strikes: game.strikes,
      bases: game.bases.map(runnerRef), steals: game.steals.map(function (x) { return x.from; }),
      runs: { away: game.runs.away, home: game.runs.home },
      hits: { away: game.hits.away, home: game.hits.home },
      errors: { away: game.errors.away, home: game.errors.home },
      lines: { away: game.lines.away.slice(), home: game.lines.home.slice() },
      over: game.over, walkoff: game.walkoff,
      log: game.log.slice(0, 6), pitchLog: game.pitchLog.slice(),
      home: teamSnap(HOME_TEAM), away: teamSnap(AWAY_TEAM)
    };
  }
  function applySnapshot(sn) {
    game.inning = sn.inning; game.half = sn.half; game.outs = sn.outs;
    game.balls = sn.balls; game.strikes = sn.strikes;
    game.bases = sn.bases.map(runnerFromRef);
    game.steals = [];
    game.runs = sn.runs; game.hits = sn.hits; game.errors = sn.errors;
    game.lines = sn.lines; game.over = sn.over; game.walkoff = sn.walkoff;
    game.log = sn.log; game.pitchLog = sn.pitchLog;
    applyTeamSnap(HOME_TEAM, sn.home);
    applyTeamSnap(AWAY_TEAM, sn.away);
  }

  // ---- 상대가 던진 공을 내 화면에서 재생 ----
  function remotePitch(msg) {
    const type = PITCH_TYPES[msg.type];
    if (!type) return;
    anim.pitch = {
      type: type, speed: msg.speed, flight: msg.flight, elapsed: 0,
      fx: msg.fx, fy: msg.fy, aim: { x: msg.fx, y: msg.fy }, swung: false, swingAt: null,
      staminaAtThrow: 1, rx: msg.rx, ry: msg.ry, bx: msg.bx, by: msg.by, hand: msg.hand
    };
    anim.batSwing = 0;
    ui.message = "";
    setPhase("wind", 750);
  }

  // ---- 수비 쪽이 확정한 결과를 내 화면에 적용 ----
  function remoteOutcome(msg) {
    if (msg.kind === "play" && msg.res) {
      anim.batted = msg.res;
      anim.pendingSnap = msg.snap;
      anim.batSwing = anim.batSwing || 0.0001;
      flash = 1;
      shake = msg.res.kind === "homerun" ? 12 : 6;
      startBallFlight(msg.res);
      setPhase("flight", 0);        // 상대가 확정한 타구를 내 화면에서도 재생
    } else if (msg.kind === "foul") {
      anim.pendingSnap = msg.snap;
      ui.message = "파울";
      setPhase("foul", 900);
    } else {
      // 볼/스트라이크/삼진/볼넷/도루 등 — 배너만 맞춰 보여주고 상태를 적용
      ui.message = msg.call || "";
      if (msg.steal) { anim.stealResult = msg.steal; applySnapshot(msg.snap); setPhase("steal", 1200); return; }
      applySnapshot(msg.snap);
      if (msg.play) { anim.play = { res: msg.play, info: msg.info || { runs: 0, extra: "" } }; setPhase("play", 1500); }
      else if (msg.snap.over) setPhase("game-end", 0);
      else nextBatter();
    }
  }

    ctx.fillStyle = "#fff";
    ctx.fillText(net && net.isHost ? "방을 만들었습니다" : "방에 참가했습니다", W / 2, 150);

    ctx.font = "15px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#9fb0bd";
    ctx.fillText("친구에게 이 코드를 알려주세요", W / 2, 200);

    roundRect(W / 2 - 150, 226, 300, 90, 12, "rgba(255,255,255,0.1)", "#64b5f6");
    ctx.font = "bold 58px 'Trebuchet MS', sans-serif";
    ctx.fillStyle = "#ffd54f";
    ctx.fillText(ui.roomCode || "----", W / 2, 292);

    ctx.font = "14px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#cfd8dd";
    ctx.fillText("내 팀: " + teamDataById(ui.myTeam).name +
      (net && net.isHost ? " (홈)" : " (원정)"), W / 2, 356);
    if (ui.netStatus) {
      ctx.fillStyle = "#81c784";
      ctx.fillText(ui.netStatus, W / 2, 388);
    }
    ctx.font = "13px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#6b7883";
    ctx.fillText("두 명이 모이면 자동으로 경기가 시작됩니다", W / 2, 424);

    const back = ROOM_BTN[2];
    roundRect(back.x, back.y, back.w, back.h, 8, "rgba(255,255,255,0.1)", "rgba(255,255,255,0.25)");
    ctx.textAlign = "center";
    ctx.font = "bold 14px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#cfd8dd";
    ctx.fillText("나가기", back.x + back.w / 2, back.y + 25);
  }

  function waitMenuClick(pt) {
    if (inRect(pt, ROOM_BTN[2])) { netSend({ t: "bye" }); netClose(); ui.menu = "room"; ui.netStatus = ""; }
  }

  function drawTitle() {
    if (ui.menu === "team") drawTeamMenu();
    else if (ui.menu === "room") drawRoomMenu();
    else if (ui.menu === "wait") drawWaitMenu();
    else drawModeMenu();
  }

  function drawGameEnd() {
    ctx.fillStyle = "rgba(8,11,15,0.96)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";

    const homeWin = game.runs.home > game.runs.away;
    const tie = game.runs.home === game.runs.away;
    const iWon = iAmHome() ? homeWin : !homeWin;
    ctx.font = "bold 40px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = tie ? "#ffd54f" : (iWon ? "#4fc3f7" : "#ff8a80");
    ctx.fillText(tie ? "무승부" : (iWon ? "승리!" : "패배"), W / 2, 90);
    if (game.walkoff && homeWin && iAmHome()) {
      ctx.font = "16px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
      ctx.fillStyle = "#ffd54f";
      ctx.fillText("끝내기 승리", W / 2, 116);
    }

    // 라인스코어
    const innings = Math.max(TOTAL_INNINGS, game.lines.away.length, game.lines.home.length);
    const cw = 44, x0 = W / 2 - (innings * cw) / 2 - 70, y0 = 150;
    ctx.font = "bold 14px 'Trebuchet MS', sans-serif";
    ctx.fillStyle = "#9fb0bd";
    for (let i = 0; i < innings; i++) ctx.fillText(String(i + 1), x0 + 100 + i * cw, y0);
    ctx.fillText("R", x0 + 110 + innings * cw, y0);
    ctx.fillText("H", x0 + 150 + innings * cw, y0);
    ctx.fillText("E", x0 + 190 + innings * cw, y0);

    [["away", AWAY_TEAM], ["home", HOME_TEAM]].forEach(function (pair, row) {
      const key = pair[0], team = pair[1];
      const y = y0 + 34 + row * 34;
      ctx.textAlign = "left";
      ctx.font = "bold 15px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
      ctx.fillStyle = "#fff";
      ctx.fillText(team.short + (key === "home" ? " (나)" : ""), x0, y);
      ctx.textAlign = "center";
      ctx.font = "15px 'Trebuchet MS', sans-serif";
      for (let i = 0; i < innings; i++) {
        const v = game.lines[key][i];
        ctx.fillStyle = v === undefined ? "#59646f" : "#e8eef2";
        ctx.fillText(v === undefined ? "-" : String(v), x0 + 100 + i * cw, y);
      }
      ctx.font = "bold 16px 'Trebuchet MS', sans-serif";
      ctx.fillStyle = "#ffd54f";
      ctx.fillText(String(game.runs[key]), x0 + 110 + innings * cw, y);
      ctx.fillStyle = "#e8eef2";
      ctx.fillText(String(game.hits[key]), x0 + 150 + innings * cw, y);
      ctx.fillText(String(game.errors[key]), x0 + 190 + innings * cw, y);
    });

    // 팀 성적
    ctx.textAlign = "center";
    ctx.font = "bold 16px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#cfd8dd";
    ctx.fillText(myTeam().name + " 타격 성적", W / 2, 268);
    ctx.font = "13px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    myTeam().lineup.forEach(function (b, i) {
      const col = i < 5 ? 0 : 1;
      const row = i % 5;
      const x = W / 2 - 240 + col * 250;
      const avg = b.ab ? (b.hit / b.ab).toFixed(3).replace("0.", ".") : ".000";
      ctx.textAlign = "left";
      ctx.fillStyle = "#9fb0bd";
      ctx.fillText((i + 1) + " " + b.name, x, 296 + row * 22);
      ctx.textAlign = "right";
      ctx.fillStyle = b.hit > 0 ? "#81c784" : "#6b7883";
      ctx.fillText(b.hit + "/" + b.ab + "  " + avg + "  " + b.rbi + "타점", x + 220, 296 + row * 22);
    });

    ctx.textAlign = "center";
    ctx.font = "bold 15px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#cfd8dd";
    ctx.fillText(myTeam().name + " 투수진", W / 2, 432);
    ctx.font = "13px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    myTeam().staff.forEach(function (p, i) {
      if (p.pitches === 0) return;
      ctx.fillStyle = "#9fb0bd";
      ctx.fillText(p.name + "  " + p.pitches + "구  " + p.k + "탈삼진  " + p.runs + "실점  체력 " +
                   Math.round(staminaRatio(p) * 100) + "%", W / 2, 456 + i * 20);
    });

    ctx.font = "bold 18px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillStyle = "#64b5f6";
    ctx.fillText("클릭해서 새 경기", W / 2, H - 24);
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    const sx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    const sy = shake > 0 ? (Math.random() - 0.5) * shake : 0;
    ctx.translate(W / 2 + sx, H / 2 + sy);
    ctx.scale(cam.scale, cam.scale);
    ctx.translate(-cam.x, -cam.y);

    drawField();
    drawFielders();
    drawPitcherFigure();
    drawZone();

    if (anim.phase === "pitch") drawPitchedBall();
    if (anim.phase === "catch") drawCaughtBall();
    if (anim.phase === "flight") drawBattedBall();

    drawMitt();
    if (batterRunnerProgress() === null && anim.phase !== "play") drawBatterFigure();
    drawRunners();

    if (flash > 0 && anim.pitch) {
      ctx.save();
      ctx.globalAlpha = flash * 0.85;
      const g = ctx.createRadialGradient(anim.pitch.fx, anim.pitch.fy, 2, anim.pitch.fx, anim.pitch.fy, 80);
      g.addColorStop(0, "#fff"); g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(anim.pitch.fx, anim.pitch.fy, 80, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    // HUD
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (anim.phase !== "title") {
      drawScoreboard();
      drawCount();
      drawMiniMap();
      drawPitcherPanel();
      drawBatterPanel();
      drawPitchPanel();
      drawPitchInfo();
      drawStealHint();
      drawBanner();
      drawMessage();
      drawSubPanel();
    }
    if (anim.phase === "title") drawTitle();
    if (anim.phase === "game-end") drawGameEnd();
  }

  // ===================== 루프 =====================
  function drawErrorBadge() {
    if (!lastError) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const msg = lastError.where + ": " + lastError.msg;
    ctx.font = "12px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    const bw = Math.max(280, Math.min(W - 40, ctx.measureText(msg).width + 28));
    roundRect(W / 2 - bw / 2, H - 56, bw, 42, 8, "rgba(120,18,18,0.94)", "#ff8a80");
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffcdd2";
    ctx.font = "bold 11px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillText("오류 " + errorCount + "회 · " + lastError.at + " (이 화면을 캡처해 주세요)", W / 2, H - 38);
    ctx.fillStyle = "#fff";
    ctx.font = "12px 'Trebuchet MS', 'Malgun Gothic', sans-serif";
    ctx.fillText(msg, W / 2, H - 21);
  }

  function loop(now) {
    requestAnimationFrame(loop);        // 한 프레임이 실패해도 게임이 멈추지 않게 먼저 예약
    if (!lastTime) lastTime = now;
    const dt = Math.min(50, now - lastTime);
    lastTime = now;
    let ok = true;
    try { update(dt); } catch (e) { noteError("update", e); ok = false; }
    try { render(); } catch (e) { noteError("render", e); ok = false; }
    try { drawErrorBadge(); } catch (e) { /* 배지까지 실패하면 무시 */ }
    if (ok) failStreak = 0;
    else if (++failStreak > 40) { failStreak = 0; recoverFromError(); }
  }

  // ===================== 초기화 =====================
  anim = { phase: "title", time: 0, dur: 0, batSwing: 0, pitch: null, play: null };
  game = {
    inning: 1, half: "top", outs: 0, balls: 0, strikes: 0, bases: [null, null, null], steals: [], pitchLog: [],
    lines: { away: [], home: [] }, runs: { away: 0, home: 0 }, hits: { away: 0, home: 0 },
    errors: { away: 0, home: 0 }, over: false, walkoff: false, log: []
  };

  canvas.addEventListener("mousedown", function (e) { e.preventDefault(); handleClick(canvasPoint(e)); });
  canvas.addEventListener("mousemove", function (e) {
    const p = canvasPoint(e);
    ui.hoverZone = (anim.phase === "aim") ? p : null;
    if (anim.phase === "title") menuHover(p);
  });
  canvas.addEventListener("touchstart", function (e) {
    e.preventDefault();
    const t = e.changedTouches[0];
    handleClick(canvasPoint({ clientX: t.clientX, clientY: t.clientY }));
  }, { passive: false });

  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "Enter") {
      e.preventDefault();
      if (anim.phase === "title") return;          // 메뉴는 클릭으로 진행
      if (anim.phase === "game-end") { anim.phase = "title"; ui.menu = "mode"; ui.pickStep = 0; netClose(); return; }
      if (anim.phase === "pitch" && !userIsPitching() && anim.pitch && !anim.pitch.swung) {
        doSwing(anim.pitch.elapsed - anim.pitch.flight);
      }
      return;
    }
    if (anim.phase === "aim") {
      if (e.key >= "1" && e.key <= "9") {
        const i = parseInt(e.key, 10) - 1;
        if (i < currentPitcher().arsenal.length) ui.selectedPitch = i;
      }
      if (e.key === "c" || e.key === "C") ui.showSub = !ui.showSub;
    }
    if (anim.phase === "title" && ui.menu === "room") {
      if (/^[a-zA-Z0-9]$/.test(e.key) && ui.roomInput.length < 4) ui.roomInput += e.key.toUpperCase();
      else if (e.key === "Backspace") ui.roomInput = ui.roomInput.slice(0, -1);
      else if (e.key === "Enter" && ui.roomInput.length === 4) netConnect(ui.roomInput, false);
      return;
    }
    if (e.key === "s" || e.key === "S") { e.preventDefault(); trySteal(); }
    if (e.key === "Escape") ui.showSub = false;
  });

  window.addEventListener("error", function (ev) { noteError("event", (ev && ev.error) || ev); });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
